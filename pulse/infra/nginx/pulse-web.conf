# Web do Pulse (ficheiros estáticos da release ativa). Dentro do server{} de TLS do vhost bmdpereira.duckdns.org, ao lado do
# `location /pulse/api/` (mais específico, por isso ganha). Repetir os add_header em cada location (um add_header num location
# apaga os do server{}).

location /pulse/assets/ {                       # ficheiros com hash no nome: cache longa
    alias /opt/pulse/current/web/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
}

location /pulse/ {                              # index.html e ícones: revalidar sempre; qualquer rota da SPA cai no index
    alias /opt/pulse/current/web/;
    try_files $uri /pulse/index.html;
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
}
