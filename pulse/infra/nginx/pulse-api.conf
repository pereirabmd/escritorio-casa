# 1) Fora do server{}, no http{} (ex.: /etc/nginx/conf.d/pulse-api.conf):
#      limit_req_zone $binary_remote_addr zone=pulse_api:10m rate=10r/s;
#
# 2) Dentro do server{} de TLS do vhost bmdpereira.duckdns.org, ao lado dos outros location
#    (/pulse/api/v1/health -> 127.0.0.1:8897/api/v1/health):

location /pulse/api/ {
    limit_req zone=pulse_api burst=30 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8897/api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;   # nunca encadear o que o cliente enviou
    proxy_set_header X-Forwarded-Proto $scheme;

    # add_header num location apaga os do server{}: repetir o HSTS aqui
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/pulse-api.access.log;
    error_log  /var/log/nginx/pulse-api.error.log;

    client_max_body_size 64k;
    client_body_timeout 10s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
}

# 3) Barreira extra: a entrada de eventos das outras apps (bilhetes_cp…) é só para a própria máquina, em http://127.0.0.1:8897.
#    Mais específico do que /pulse/api/, ganha. O Pulse já recusa pedidos com X-Real-IP; isto impede sequer que cheguem lá.
location ^~ /pulse/api/v1/internal/ {
    return 404;
}
