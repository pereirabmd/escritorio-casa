<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E5A6E">
<title>Ciclismo · Plano de Treino</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg:#F5F8F8; --card:#FFFFFF; --border:#E1E8E8;
    --ink:#12313D; --ink-dim:#66787D; --ink-faint:#9AA9AC;
    --esmeralda:#12B76A; --esmeralda-soft:#E5F8EE;
    --petroleo:#0E5A6E; --petroleo-soft:#E4EFF1;
    --ceu:#33B1F0; --ceu-soft:#E9F7FE;
    --amarelo:#EFAE00; --amarelo-soft:#FCF2D6; --condicional-text:#8a6c00;
    --rest:#9BA8AB; --rest-soft:#EEF1F1;
  }
  [data-theme="dark"]{
    --bg:#0E1719; --card:#17262A; --border:#243A3E;
    --ink:#EAF3F1; --ink-dim:#93AAAC; --ink-faint:#647D80;
    --esmeralda:#25D68E; --esmeralda-soft:rgba(37,214,142,.15);
    --petroleo:#4CB2CE; --petroleo-soft:rgba(76,178,206,.15);
    --ceu:#5BC8FB; --ceu-soft:rgba(91,200,251,.14);
    --amarelo:#FFC83C; --amarelo-soft:rgba(255,200,60,.16); --condicional-text:#FFD873;
    --rest:#7C8F92; --rest-soft:rgba(124,143,146,.14);
  }
  html{ background:var(--bg); }
  html, body{ transition: background-color .25s ease; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; height:100svh; overflow:hidden;}
  body{display:flex; flex-direction:column;}
  .scroll-area{ flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    display:flex; flex-direction:column; }

  header.top{ padding:22px 20px 0; position:relative; z-index:1; flex-shrink:0; }
  .theme-btn{
    position:absolute; top:18px; right:18px; width:34px; height:34px; border-radius:50%;
    border:1px solid var(--border); background:var(--card); display:flex; align-items:center;
    justify-content:center; cursor:pointer; padding:0; transition:background-color .2s ease, border-color .2s ease;
  }
  .theme-btn svg{ width:16px; height:16px; stroke:var(--ink-dim); }
  .theme-btn:active{ transform:scale(.93); }
  .eyebrow{ font-size:11px; font-weight:700; letter-spacing:.14em; color:var(--petroleo); text-transform:uppercase; margin:0 0 4px;}
  h1{ font-size:23px; font-weight:800; letter-spacing:-.01em; margin:0; }
  .updated-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:8px; }
  .updated{ font-size:12px; color:var(--ink-dim); line-height:1.4; }
  .updated b{ color:var(--ink); font-weight:600; }
  .upload-btn{
    appearance:none; border:1.5px solid var(--petroleo); background:var(--petroleo);
    color:#fff; font-size:12.5px; font-weight:700; letter-spacing:.01em;
    padding:9px 14px; border-radius:9px; cursor:pointer; white-space:nowrap; flex-shrink:0;
  }
  .upload-btn:active{ transform:scale(.97); }
  .install-btn{ background:var(--esmeralda); border-color:var(--esmeralda); }
  .drive-btn{ background:transparent; color:var(--petroleo); }
  .drive-btn.connected{ background:var(--petroleo-soft); }

  .week-picker-row{ margin-top:10px; }
  #weekPicker{
    width:100%; font-size:12.5px; font-weight:600; color:var(--ink); background:var(--card);
    border:1px solid var(--border); border-radius:9px; padding:8px 10px; appearance:none;
  }
  .history-banner{
    margin-top:8px; font-size:11.5px; color:var(--condicional-text); background:var(--amarelo-soft);
    border-radius:8px; padding:7px 10px;
  }
  .history-banner button{
    appearance:none; border:none; background:none; color:var(--petroleo); font-weight:700;
    font-size:11.5px; text-decoration:underline; cursor:pointer; padding:0;
  }
  #fileInput{ display:none; }

  nav.tabs{
    display:flex; margin-top:18px; border-bottom:1px solid var(--border);
    flex-shrink:0; background:var(--bg); position:relative; z-index:1;
  }
  nav.tabs button{
    appearance:none; background:none; border:none; flex:1;
    font-size:12.5px; font-weight:700; color:var(--ink-faint);
    padding:11px 4px 10px; cursor:pointer; letter-spacing:.01em;
    border-bottom:2px solid transparent; margin-bottom:-1px;
    transition:color .2s ease, border-color .2s ease;
  }
  nav.tabs button.active{ color:var(--petroleo); border-color:var(--petroleo); }

  main{ flex:1; padding:16px 20px 28px; position:relative; z-index:1; }
  .panel{ display:none; }
  .panel.active{ display:block; animation:panelIn .34s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes panelIn{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }
  @media (prefers-reduced-motion: reduce){ .panel.active{ animation:none; } }

  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:14px 16px; margin-bottom:12px;
  }
  .card h3{ margin:0 0 10px; font-size:13px; font-weight:800; color:var(--ink); }

  /* ---- Semana / day cards ---- */
  .summary-card{
    background:linear-gradient(120deg, var(--petroleo-soft), var(--card) 60%);
    border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:14px;
  }
  .summary-card h3{ margin:0 0 10px; font-size:12px; font-weight:800; color:var(--petroleo); text-transform:uppercase; letter-spacing:.04em; }
  .summary-stats{ display:flex; gap:10px; flex-wrap:wrap; }
  .summary-stat{ flex:1; min-width:74px; }
  .summary-stat .num{ font-size:19px; font-weight:800; color:var(--ink); line-height:1.1; }
  .summary-stat .lbl{ font-size:10.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.03em; margin-top:2px; }

  .day-card{ border-radius:14px; border:1px solid var(--border); border-left-width:4px; background:var(--card); margin-bottom:12px; overflow:hidden;
    opacity:0; animation:cardIn .45s cubic-bezier(.2,.7,.3,1) forwards; }
  .day-card.today{ box-shadow:0 0 0 2px var(--petroleo); }
  .day-card:nth-child(1){ animation-delay:.02s; }
  .day-card:nth-child(2){ animation-delay:.07s; }
  .day-card:nth-child(3){ animation-delay:.12s; }
  .day-card:nth-child(4){ animation-delay:.17s; }
  .day-card:nth-child(5){ animation-delay:.22s; }
  .day-card:nth-child(6){ animation-delay:.27s; }
  .day-card:nth-child(7){ animation-delay:.32s; }
  @keyframes cardIn{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:translateY(0); } }
  @media (prefers-reduced-motion: reduce){ .day-card{ animation:none; opacity:1; } }
  .today-pill{ font-size:9.5px; font-weight:800; letter-spacing:.04em; color:#fff; background:var(--petroleo); padding:2px 7px; border-radius:999px; margin-left:8px; text-transform:uppercase; }

  .rest-row{
    display:flex; align-items:center; gap:10px; padding:9px 14px; margin-bottom:8px;
    border:1px dashed var(--border); border-radius:10px; opacity:0; animation:restIn .4s ease forwards;
  }
  @keyframes restIn{ from{ opacity:0; transform:translateY(8px); } to{ opacity:.65; transform:translateY(0); } }
  @media (prefers-reduced-motion: reduce){ .rest-row{ animation:none; opacity:.65; } }
  .rest-row .day-dot{ width:7px; height:7px; }
  .rest-row .day-name{ font-size:12.5px; font-weight:700; color:var(--ink-dim); }
  .rest-row .day-date{ font-size:11px; color:var(--ink-faint); }
  .rest-row.today{ border-style:solid; border-color:var(--petroleo); opacity:.9; }
  .rest-row .rest-label{ margin-left:auto; font-size:10.5px; color:var(--ink-faint); font-style:italic; }
  .day-head{ display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--border);
    background-size:220% 220%; animation:gradientShift 9s ease-in-out infinite; }
  @keyframes gradientShift{ 0%{ background-position:0% 50%; } 50%{ background-position:100% 50%; } 100%{ background-position:0% 50%; } }
  @media (prefers-reduced-motion: reduce){ .day-head{ animation:none; } }
  .session-block:nth-of-type(even){ background:var(--rest-soft); margin:2px -14px 0; padding:8px 14px; }
  .day-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .day-name{ font-size:14px; font-weight:800; }
  .day-date{ font-size:11.5px; color:var(--ink-dim); }
  .day-status{ margin-left:auto; font-size:10.5px; font-weight:700; letter-spacing:.03em; padding:3px 9px; border-radius:999px; text-transform:uppercase; }
  .status-realizado{ background:var(--esmeralda-soft); color:var(--esmeralda); }
  .status-planeado{ background:var(--petroleo-soft); color:var(--petroleo); }
  .status-condicional{ background:var(--amarelo-soft); color:var(--condicional-text); }
  .day-body{ padding:6px 14px 12px; }
  .session-block{ padding:8px 0; }
  .session-block + .session-block{ border-top:1px dashed var(--border); }
  .session-heading{ font-size:11px; font-weight:800; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; }
  .kv-row{ display:flex; justify-content:space-between; gap:12px; padding:3px 0; font-size:13px; }
  .kv-row .k{ color:var(--ink-dim); }
  .kv-row .v{ color:var(--ink); font-weight:600; text-align:right; }
  .para-row{ font-size:13px; color:var(--ink); padding:4px 0; line-height:1.45; }
  .para-row.heading{ font-weight:800; font-size:12px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-dim); margin-top:6px; }
  .bullet-row{ display:flex; gap:8px; align-items:flex-start; padding:3px 0; font-size:13px; line-height:1.45; }
  .bullet-row .dot{ width:6px; height:6px; border-radius:50%; margin-top:6px; flex-shrink:0; background:var(--amarelo); }
  .total-row{ margin-top:8px; padding:8px 10px; background:var(--petroleo-soft); border-radius:8px; font-size:12.5px; font-weight:700; color:var(--petroleo); }

  /* ---- Zonas ---- */
  .zone-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); }
  .zone-row:last-child{ border-bottom:none; }
  .zone-chip{ width:34px; height:22px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:#fff; flex-shrink:0; }
  .zone-label{ font-size:13px; font-weight:700; flex:1; }
  .zone-range{ font-size:12.5px; color:var(--ink-dim); font-variant-numeric:tabular-nums; }

  .dist-row{ display:flex; align-items:center; gap:10px; padding:7px 0; }
  .dist-chip{ width:28px; font-size:11px; font-weight:800; color:var(--ink-dim); flex-shrink:0; }
  .dist-track{ flex:1; height:10px; background:var(--rest-soft); border-radius:999px; overflow:hidden; }
  .dist-fill{ height:100%; border-radius:999px; transition:width .5s ease; }
  .dist-val{ font-size:11.5px; color:var(--ink-dim); width:44px; text-align:right; flex-shrink:0; }

  details.extra{ margin-top:2px; }
  details.extra summary{ font-size:12px; font-weight:700; color:var(--ink-dim); cursor:pointer; padding:6px 0; }

  .empty{ text-align:center; padding:70px 24px; color:var(--ink-dim); }
  .empty svg{ opacity:.5; margin-bottom:14px; }
  .empty p{ font-size:13.5px; line-height:1.5; max-width:260px; margin:0 auto; }

  footer{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    padding:18px 20px 26px; margin-top:auto; position:relative; z-index:1;
  }
  footer img.brand{ height:36px; width:auto; opacity:.85; display:block; }
  footer span{ font-size:11px; color:var(--ink-faint); font-weight:600; letter-spacing:.02em; }

  .watermark{
    position:fixed; left:50%; bottom:-70px; width:380px; max-width:70vw;
    transform:translateX(-50%); opacity:.07; pointer-events:none; z-index:0;
    filter:saturate(1.1); transition:opacity .25s ease;
  }
  [data-theme="dark"] .watermark{ opacity:.12; }
  @media (prefers-reduced-motion: no-preference){
    .watermark{ animation:drift 26s ease-in-out infinite; }
  }
  @keyframes drift{
    0%,100%{ transform:translateX(-50%) translateY(0) rotate(0deg); }
    50%{ transform:translateX(-50%) translateY(-10px) rotate(2deg); }
  }

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translate(-50%,12px);
    background:var(--petroleo); color:#fff; font-size:13px; font-weight:700;
    padding:10px 18px; border-radius:999px; opacity:0; pointer-events:none;
    transition:opacity .25s ease, transform .25s ease; z-index:20;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>

<img class="watermark" src="icon-watermark.png" alt="" aria-hidden="true">

<header class="top">
  <button class="theme-btn" id="themeBtn" aria-label="Alternar modo noturno"></button>
  <p class="eyebrow">Ciclismo de Estrada</p>
  <h1>Plano de Treino</h1>
  <div class="updated-row">
    <div class="updated" id="updatedLabel">Nenhum plano carregado</div>
    <button class="upload-btn install-btn" id="installBtn" style="display:none">Instalar app</button>
    <button class="upload-btn drive-btn" id="driveBtn">Drive</button>
    <button class="upload-btn" id="uploadBtn">Carregar .txt</button>
    <input type="file" id="fileInput" accept=".txt,text/plain">
  </div>
  <div class="week-picker-row" id="weekPickerRow" style="display:none">
    <select id="weekPicker"></select>
  </div>
  <div class="history-banner" id="historyBanner" style="display:none">
    A ver uma semana anterior · <button id="backToLatestBtn">voltar à mais recente</button>
  </div>
</header>

<nav class="tabs">
  <button class="tab-btn active" data-tab="semana">Semana</button>
  <button class="tab-btn" data-tab="atleta">Atleta</button>
  <button class="tab-btn" data-tab="zonas">Zonas</button>
  <button class="tab-btn" data-tab="mais">Mais</button>
</nav>

<div class="scroll-area">
<main>
  <div class="panel active" id="panel-semana"></div>
  <div class="panel" id="panel-atleta"></div>
  <div class="panel" id="panel-zonas"></div>
  <div class="panel" id="panel-mais"></div>
</main>

<script>
(function(){
  var STORAGE_KEY = 'ciclismo.plano';
  var DAY_ORDER = ['SEGUNDA','TERCA','QUARTA','QUINTA','SEXTA','SABADO','DOMINGO'];
  var DAY_SHORT = {SEGUNDA:'Segunda',TERCA:'Terça',QUARTA:'Quarta',QUINTA:'Quinta',SEXTA:'Sexta',SABADO:'Sábado',DOMINGO:'Domingo'};

  function stripAccents(s){ return s.normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  /* ---------------- PARSER ---------------- */

  function parseFreeform(rawLines){
    var items = [];
    rawLines.forEach(function(raw){
      var indent = raw.length - raw.replace(/^\s+/,'').length;
      var t = raw.trim();
      if (!t) return;
      if (/^[-*]\s+/.test(t)){
        items.push({type:'bullet', text:t.replace(/^[-*]\s+/,'')});
      } else if (indent > 0 && items.length){
        items[items.length-1].text += ' ' + t;
      } else {
        items.push({type:'para', text:t});
      }
    });
    return items;
  }

  function splitByMarker(lines, regex){
    // returns array of {header, lines} splitting on lines fully matched by regex (the header line itself excluded)
    var blocks = []; var current = null;
    lines.forEach(function(line){
      var m = line.match(regex);
      if (m){
        if (current) blocks.push(current);
        current = {header: m[1] ? m[1].trim() : line.trim(), lines: []};
      } else if (current){
        current.lines.push(line);
      }
    });
    if (current) blocks.push(current);
    return blocks;
  }

  function parseDayBlock(lines){
    var sessions = []; var current = {heading:null, items:[]};
    var totalLine = null;
    var hasContent = false;
    lines.forEach(function(raw){
      var t = raw.trim();
      if (!t) return;
      if (/^Sess[aã]o\s*\d+.*:\s*$/i.test(t)){
        if (hasContent) sessions.push(current);
        current = {heading:t.replace(/:\s*$/,''), items:[]};
        hasContent = false;
      } else if (/^Total do dia:/i.test(t)){
        totalLine = t.replace(/^Total do dia:\s*/i,'');
      } else {
        hasContent = true;
        var indent = raw.length - raw.replace(/^\s+/,'').length;
        if (/^[-*]\s+/.test(t)){
          current.items.push({type:'bullet', text:t.replace(/^[-*]\s+/,'')});
        } else if (indent > 2 && current.items.length){
          current.items[current.items.length-1].text += ' ' + t;
        } else {
          current.items.push({type:'para', text:t});
        }
      }
    });
    if (hasContent) sessions.push(current);
    return {sessions: sessions, totalLine: totalLine};
  }

  function parseHrZones(lines){
    var zones = []; var rest = [];
    lines.forEach(function(raw){
      var t = raw.trim();
      if (!t) return;
      var m = t.match(/^(Z[1-5])\s*-\s*(.+?):\s*(.+)$/i);
      if (m){ zones.push({zone:m[1].toUpperCase(), label:m[2], range:m[3]}); }
      else rest.push(raw);
    });
    return {zones: zones, notes: parseFreeform(rest)};
  }

  function normalizeHeader(h){
    return stripAccents(h).toUpperCase().replace(/\s+/g,' ').trim();
  }

  function parseTrainingFile(text){
    var allLines = text.split(/\r?\n/);
    var markerIdx = [];
    allLines.forEach(function(l,i){ if (/^=+\s*$/.test(l.trim())) markerIdx.push(i); });

    var preamble = markerIdx.length ? allLines.slice(0, markerIdx[0]) : allLines.slice();
    var sections = [];
    var i = 0;
    while (i+1 < markerIdx.length){
      var startEq = markerIdx[i];
      var headerLine = (allLines[startEq+1] || '').trim();
      var endEq = markerIdx[i+1];
      var contentEnd = (i+2 < markerIdx.length) ? markerIdx[i+2] : allLines.length;
      var content = allLines.slice(endEq+1, contentEnd);
      sections.push({header: headerLine, lines: content});
      i += 2;
    }

    var result = { meta:{}, athlete:null, hrZones:null, calories:null, days:null, notes:null, devices:null, extra:[] };

    var titleLine = preamble.find(function(l){ return l.trim(); });
    result.meta.title = titleLine ? titleLine.trim() : 'Plano de Treino';
    preamble.forEach(function(l){
      var mg = l.match(/Ficheiro gerado em:\s*(.+)/i);
      if (mg) result.meta.generatedAt = mg[1].trim();
      var mw = l.match(/^(?:Semana|Periodo):\s*(.+)/i);
      if (mw) result.meta.weekRange = mw[1].trim();
    });

    sections.forEach(function(sec){
      var h = normalizeHeader(sec.header);
      if (h.indexOf('DADOS DO ATLETA') !== -1){
        result.athlete = parseFreeform(sec.lines);
      } else if (h.indexOf('ZONAS DE FREQUENCIA') !== -1){
        result.hrZones = parseHrZones(sec.lines);
      } else if (h.indexOf('CALCULO DE CALORIAS') !== -1){
        result.calories = parseFreeform(sec.lines);
      } else if (h.indexOf('RESUMO SEMANAL') !== -1 || h.indexOf('DIA A DIA') !== -1){
        var dayBlocks = splitByMarker(sec.lines, /^---\s*(.+?)\s*---\s*$/);
        var days = {};
        dayBlocks.forEach(function(db){
          var m = db.header.match(/^(\S+)\s+([\d.\-\/]+)(?:\s*\((.+)\))?\s*$/);
          var name, date, status;
          if (m){ name = m[1].toUpperCase(); date = m[2]; status = m[3]; }
          else { name = db.header.toUpperCase(); date=''; status=''; }
          var canon = DAY_ORDER.find(function(d){ return name.indexOf(d.slice(0,3)) === 0 || stripAccents(name).indexOf(d.slice(0,3)) === 0; }) || name;
          days[canon] = { date:date, status:status, raw: parseDayBlock(db.lines) };
        });
        result.days = days;
      } else if (h.indexOf('CONTEXTO E NOTAS') !== -1){
        result.notes = parseFreeform(sec.lines);
      } else if (h.indexOf('DISPOSITIVOS') !== -1){
        result.devices = parseFreeform(sec.lines);
      } else {
        result.extra.push({header: sec.header, items: parseFreeform(sec.lines)});
      }
    });

    return result;
  }

  /* ---------------- RENDER HELPERS ---------------- */

  function renderFreeformItems(items){
    var html = '';
    items.forEach(function(it){
      if (it.type === 'bullet'){
        html += '<div class="bullet-row"><div class="dot"></div><div>' + esc(it.text) + '</div></div>';
      } else {
        var m = it.text.match(/^([^:]{1,42}):\s*(.+)$/);
        if (m){
          html += '<div class="kv-row"><span class="k">' + esc(m[1]) + '</span><span class="v">' + esc(m[2]) + '</span></div>';
        } else if (/:\s*$/.test(it.text)){
          html += '<div class="para-row heading">' + esc(it.text.replace(/:\s*$/,'')) + '</div>';
        } else {
          html += '<div class="para-row">' + esc(it.text) + '</div>';
        }
      }
    });
    return html;
  }

  function classifyDay(raw){
    var joined = raw.sessions.map(function(s){ return s.items.map(function(it){return it.text;}).join(' '); }).join(' ');
    var n = stripAccents(joined).toLowerCase();
    if (n.indexOf('descanso') !== -1 && raw.sessions.length <= 1) return 'rest';
    if (n.indexOf('z3') !== -1 || n.indexOf('z4') !== -1 || n.indexOf('limiar') !== -1 || n.indexOf('forte') !== -1) return 'intense';
    return 'easy';
  }

  function statusClass(status){
    var n = stripAccents(status||'').toUpperCase();
    if (n.indexOf('REALIZADO') !== -1) return 'status-realizado';
    if (n.indexOf('CONDICIONAL') !== -1) return 'status-condicional';
    return 'status-planeado';
  }

  var KIND_GRADIENT = {
    rest: 'linear-gradient(120deg, var(--rest-soft), var(--card) 45%, var(--rest-soft))',
    intense: 'linear-gradient(120deg, var(--amarelo-soft), var(--card) 45%, var(--amarelo-soft))',
    easy: 'linear-gradient(120deg, var(--esmeralda-soft), var(--card) 45%, var(--esmeralda-soft))'
  };
  var KIND_STYLE = {
    rest: {dot:'var(--rest)', soft:'var(--rest-soft)'},
    intense: {dot:'var(--amarelo)', soft:'var(--amarelo-soft)'},
    easy: {dot:'var(--esmeralda)', soft:'var(--esmeralda-soft)'}
  };

  function todayStr(){
    var d = new Date();
    var mm = String(d.getMonth()+1).padStart(2,'0');
    var dd = String(d.getDate()).padStart(2,'0');
    return d.getFullYear() + '-' + mm + '-' + dd;
  }

  function extractNumber(text, unit){
    var re = new RegExp('([\\d]+(?:[.,]\\d+)?)\\s*' + unit, 'i');
    var m = text.match(re);
    return m ? parseFloat(m[1].replace(',', '.')) : 0;
  }

  function computeWeekSummary(data){
    var totalKm = 0, totalMin = 0, sessions = 0, restDays = 0;
    DAY_ORDER.forEach(function(day){
      var d = data.days[day];
      if (!d) return;
      var kind = classifyDay(d.raw);
      if (kind === 'rest') restDays++;
      d.raw.sessions.forEach(function(s){
        sessions++;
        s.items.forEach(function(it){
          if (it.type !== 'para') return;
          var low = stripAccents(it.text).toLowerCase();
          if (low.indexOf('distancia') !== -1) totalKm += extractNumber(it.text, 'km');
          if (low.indexOf('duracao') !== -1) totalMin += extractNumber(it.text, 'min');
        });
      });
    });
    return {totalKm:totalKm, totalMin:totalMin, sessions:sessions, restDays:restDays};
  }

  function renderSummary(data){
    var s = computeWeekSummary(data);
    var hours = Math.floor(s.totalMin/60), mins = Math.round(s.totalMin%60);
    var timeStr = s.totalMin > 0 ? (hours > 0 ? hours + 'h' + (mins ? String(mins).padStart(2,'0') : '') : mins + 'min') : '—';
    var html = '<div class="summary-card"><h3>Resumo da Semana</h3><div class="summary-stats">';
    html += '<div class="summary-stat"><div class="num">' + (s.totalKm > 0 ? s.totalKm.toFixed(0) : '—') + '</div><div class="lbl">km previstos</div></div>';
    html += '<div class="summary-stat"><div class="num">' + timeStr + '</div><div class="lbl">tempo previsto</div></div>';
    html += '<div class="summary-stat"><div class="num">' + s.sessions + '</div><div class="lbl">sessões</div></div>';
    html += '<div class="summary-stat"><div class="num">' + s.restDays + '</div><div class="lbl">dias de descanso</div></div>';
    html += '</div></div>';
    return html;
  }

  function renderSemana(data){
    if (!data.days) return emptyStateHtml();
    var html = renderSummary(data); var today = todayStr();
    DAY_ORDER.forEach(function(day){
      var d = data.days[day];
      if (!d){
        html += '<div class="rest-row"><div class="day-dot" style="background:var(--rest)"></div><div class="day-name">' + DAY_SHORT[day] + '</div><div class="rest-label">sem dados</div></div>';
        return;
      }
      var kind = classifyDay(d.raw);
      var isToday = d.date && d.date === today;
      if (kind === 'rest'){
        html += '<div class="rest-row' + (isToday ? ' today' : '') + '" data-date="' + esc(d.date) + '"><div class="day-dot" style="background:var(--rest)"></div>';
        html += '<div class="day-name">' + DAY_SHORT[day] + (isToday ? '<span class="today-pill">Hoje</span>' : '') + '</div><div class="day-date">' + esc(d.date) + '</div><div class="rest-label">descanso</div></div>';
        return;
      }
      var style = KIND_STYLE[kind];
      html += '<div class="day-card' + (isToday ? ' today' : '') + '" style="border-left-color:' + style.dot + '" data-date="' + esc(d.date) + '">';
      html += '<div class="day-head" style="background:' + KIND_GRADIENT[kind] + '"><div class="day-dot" style="background:' + style.dot + '"></div>';
      html += '<div><div class="day-name">' + DAY_SHORT[day] + (isToday ? '<span class="today-pill">Hoje</span>' : '') + '</div><div class="day-date">' + esc(d.date) + '</div></div>';
      if (d.status) html += '<div class="day-status ' + statusClass(d.status) + '">' + esc(d.status) + '</div>';
      html += '</div><div class="day-body">';
      d.raw.sessions.forEach(function(s){
        html += '<div class="session-block">';
        if (s.heading) html += '<div class="session-heading">' + esc(s.heading) + '</div>';
        html += renderFreeformItems(s.items);
        html += '</div>';
      });
      if (d.raw.totalLine) html += '<div class="total-row">Total do dia — ' + esc(d.raw.totalLine) + '</div>';
      html += '</div></div>';
    });
    return html;
  }

  function renderAtleta(data){
    if (!data.athlete) return emptyStateHtml();
    var html = '<div class="card"><h3>Dados do Atleta</h3>' + renderFreeformItems(data.athlete) + '</div>';
    return html;
  }

  var ZONE_VAR = {Z1:'var(--rest)', Z2:'var(--esmeralda)', Z3:'var(--ceu)', Z4:'var(--amarelo)', Z5:'var(--petroleo)'};

  function computeZoneDistribution(data){
    var totals = {Z1:0,Z2:0,Z3:0,Z4:0,Z5:0};
    if (!data.days) return totals;
    DAY_ORDER.forEach(function(day){
      var d = data.days[day]; if (!d) return;
      d.raw.sessions.forEach(function(s){
        var zones = []; var minutes = 0;
        s.items.forEach(function(it){
          if (it.type !== 'para') return;
          var mZ = it.text.match(/Z[1-5](?:\s*\/\s*Z[1-5])*/i);
          if (mZ){ var found = mZ[0].toUpperCase().match(/Z[1-5]/g); zones = zones.concat(found); }
          var low = stripAccents(it.text).toLowerCase();
          if (low.indexOf('duracao') !== -1){ var mm = extractNumber(it.text, 'min'); if (mm) minutes = mm; }
        });
        if (!minutes || !zones.length) return;
        var uniq = zones.filter(function(z,i){ return zones.indexOf(z) === i; });
        var share = minutes / uniq.length;
        uniq.forEach(function(z){ totals[z] = (totals[z]||0) + share; });
      });
    });
    return totals;
  }

  function renderZoneDistribution(data){
    var totals = computeZoneDistribution(data);
    var values = ['Z1','Z2','Z3','Z4','Z5'].map(function(z){ return totals[z]||0; });
    var max = Math.max.apply(null, values.concat([1]));
    if (values.every(function(v){ return v === 0; })) return '';
    var html = '<div class="card"><h3>Distribuição de Tempo por Zona (semana)</h3>';
    ['Z1','Z2','Z3','Z4','Z5'].forEach(function(z){
      var v = totals[z]||0;
      var pct = max > 0 ? Math.round((v/max)*100) : 0;
      html += '<div class="dist-row"><div class="dist-chip">' + z + '</div><div class="dist-track"><div class="dist-fill" style="width:' + pct + '%;background:' + (ZONE_VAR[z]||'var(--ink-faint)') + '"></div></div><div class="dist-val">' + (v > 0 ? Math.round(v) + 'min' : '—') + '</div></div>';
    });
    html += '</div>';
    return html;
  }

  function renderZonas(data){
    if (!data.hrZones) return emptyStateHtml();
    var html = '<div class="card"><h3>Zonas de Frequência Cardíaca</h3>';
    data.hrZones.zones.forEach(function(z){
      html += '<div class="zone-row"><div class="zone-chip" style="background:' + (ZONE_VAR[z.zone]||'var(--ink-faint)') + '">' + z.zone + '</div>';
      html += '<div class="zone-label">' + esc(z.label) + '</div><div class="zone-range">' + esc(z.range) + '</div></div>';
    });
    html += '</div>';
    html += renderZoneDistribution(data);
    if (data.hrZones.notes && data.hrZones.notes.length){
      html += '<div class="card">' + renderFreeformItems(data.hrZones.notes) + '</div>';
    }
    return html;
  }

  function renderMais(data){
    var html = '';
    if (data.notes && data.notes.length){
      html += '<div class="card"><h3>Contexto e Notas de Treino</h3>' + renderFreeformItems(data.notes) + '</div>';
    }
    if (data.calories && data.calories.length){
      html += '<div class="card"><h3>Cálculo de Calorias</h3>' + renderFreeformItems(data.calories) + '</div>';
    }
    if (data.devices && data.devices.length){
      html += '<div class="card"><h3>Dispositivos e Ferramentas</h3>' + renderFreeformItems(data.devices) + '</div>';
    }
    (data.extra||[]).forEach(function(ex){
      html += '<div class="card"><h3>' + esc(ex.header) + '</h3>' + renderFreeformItems(ex.items) + '</div>';
    });
    if (!html) return emptyStateHtml();
    return html;
  }

  function emptyStateHtml(){
    return '<div class="empty"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#9AA9AC" stroke-width="1.5">' +
      '<circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/>' +
      '<path d="M15 6a1 1 0 100-2 1 1 0 000 2zM12 17.5V14l-3-3 4-3 2 3h3"/></svg>' +
      '<p>Ainda não há dados nesta secção. Carrega um ficheiro .txt para começar.</p></div>';
  }

  /* ---------------- APP STATE ---------------- */

  function loadStored(){
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    try { return JSON.parse(raw); } catch(e){ return null; }
  }

  function renderAll(){
    var stored = loadStored();
    var updatedLabel = document.getElementById('updatedLabel');
    if (!stored){
      updatedLabel.textContent = 'Nenhum plano carregado';
      document.getElementById('panel-semana').innerHTML = emptyStateHtml();
      document.getElementById('panel-atleta').innerHTML = emptyStateHtml();
      document.getElementById('panel-zonas').innerHTML = emptyStateHtml();
      document.getElementById('panel-mais').innerHTML = emptyStateHtml();
      return;
    }
    var d = new Date(stored.updatedAt);
    var dateStr = d.toLocaleDateString('pt-PT') + ' às ' + d.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'});
    updatedLabel.innerHTML = 'Atualizado <b>' + dateStr + '</b>' + (stored.sourceName ? ' · ' + esc(stored.sourceName) : '');
    var data = stored.data;
    document.getElementById('panel-semana').innerHTML = renderSemana(data);
    document.getElementById('panel-atleta').innerHTML = renderAtleta(data);
    document.getElementById('panel-zonas').innerHTML = renderZonas(data);
    document.getElementById('panel-mais').innerHTML = renderMais(data);
    scrollToToday();
  }

  function scrollToToday(){
    var viaShortcut = /[?&]view=hoje/.test(location.search);
    setTimeout(function(){
      var el = document.querySelector('.day-card.today, .rest-row.today');
      if (el) el.scrollIntoView({behavior: viaShortcut ? 'auto' : 'smooth', block:'center'});
    }, viaShortcut ? 120 : 420);
  }

  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 2400);
  }

  document.getElementById('uploadBtn').addEventListener('click', function(){
    document.getElementById('fileInput').click();
  });

  document.getElementById('fileInput').addEventListener('change', function(e){
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(evt){
      try {
        var data = parseTrainingFile(evt.target.result);
        var record = { updatedAt: Date.now(), sourceName: file.name, data: data };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(record));
        renderAll();
        toast('Plano substituído com sucesso');
      } catch(err){
        toast('Não foi possível ler este ficheiro');
      }
    };
    reader.readAsText(file, 'UTF-8');
    e.target.value = '';
  });

  document.querySelectorAll('.tab-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
      document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    });
  });

  /* ---------------- Tema ---------------- */
  var MOON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>';
  var SUN_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';

  function applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    var btn = document.getElementById('themeBtn');
    if (btn) btn.innerHTML = theme === 'dark' ? SUN_SVG : MOON_SVG;
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'dark' ? '#0E1719' : '#0E5A6E');
    localStorage.setItem('ciclismo.theme', theme);
  }

  function initTheme(){
    var stored = localStorage.getItem('ciclismo.theme');
    var theme = stored || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    applyTheme(theme);
  }
  var themeBtn = document.getElementById('themeBtn');
  if (themeBtn) themeBtn.addEventListener('click', function(){
    var current = document.documentElement.getAttribute('data-theme');
    applyTheme(current === 'dark' ? 'light' : 'dark');
  });
  initTheme();

  /* ---------------- Google Drive ---------------- */
  var DRIVE_CLIENT_ID = '108256538530-fgunbb52s7f3s9aurfpjtaf01v8fjbph.apps.googleusercontent.com';
  var DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.readonly';
  var DRIVE_TOKEN_KEY = 'ciclismo.driveToken';
  var driveTokenClient = null;
  var driveFiles = [];

  function getCachedDriveToken(){
    try {
      var raw = localStorage.getItem(DRIVE_TOKEN_KEY);
      if (!raw) return null;
      var obj = JSON.parse(raw);
      if (obj.expiresAt && Date.now() < obj.expiresAt) return obj.token;
    } catch(e){}
    return null;
  }
  function cacheDriveToken(token, expiresInSeconds){
    localStorage.setItem(DRIVE_TOKEN_KEY, JSON.stringify({
      token: token, expiresAt: Date.now() + (expiresInSeconds - 60) * 1000
    }));
  }

  function driveFetch(url){
    var token = getCachedDriveToken();
    if (!token) return Promise.reject(new Error('no-token'));
    return fetch(url, {headers:{'Authorization':'Bearer ' + token}}).then(function(res){
      if (res.status === 401){ localStorage.removeItem(DRIVE_TOKEN_KEY); throw new Error('unauthorized'); }
      return res;
    });
  }

  function ensureDriveToken(){
    var cached = getCachedDriveToken();
    if (cached) return Promise.resolve(cached);
    return new Promise(function(resolve, reject){
      if (!window.google || !google.accounts || !google.accounts.oauth2){
        reject(new Error('gis-not-ready')); return;
      }
      if (!driveTokenClient){
        driveTokenClient = google.accounts.oauth2.initTokenClient({
          client_id: DRIVE_CLIENT_ID,
          scope: DRIVE_SCOPE,
          callback: function(resp){
            if (resp.error){ reject(resp); return; }
            cacheDriveToken(resp.access_token, resp.expires_in || 3600);
            resolve(resp.access_token);
          }
        });
      }
      driveTokenClient.requestAccessToken({prompt: ''});
    });
  }

  function findCiclismoFolder(){
    var q = encodeURIComponent("name = 'ciclismo' and mimeType = 'application/vnd.google-apps.folder' and trashed = false");
    return driveFetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id,name)&pageSize=5')
      .then(function(res){ return res.json(); })
      .then(function(data){
        if (!data.files || !data.files.length) throw new Error('folder-not-found');
        return data.files[0].id;
      });
  }

  function listCiclismoFiles(folderId){
    var q = encodeURIComponent("'" + folderId + "' in parents and trashed = false and mimeType != 'application/vnd.google-apps.folder'");
    return driveFetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id,name,modifiedTime)&orderBy=modifiedTime desc&pageSize=30')
      .then(function(res){ return res.json(); })
      .then(function(data){ return data.files || []; });
  }

  function downloadDriveFile(fileId){
    return driveFetch('https://www.googleapis.com/drive/v3/files/' + fileId + '?alt=media')
      .then(function(res){ return res.text(); });
  }

  function populateWeekPicker(files, selectedId){
    driveFiles = files;
    var picker = document.getElementById('weekPicker');
    var row = document.getElementById('weekPickerRow');
    if (!files.length){ row.style.display = 'none'; return; }
    picker.innerHTML = files.map(function(f){
      var d = new Date(f.modifiedTime);
      var label = f.name.replace(/\.txt$/i,'') + ' · ' + d.toLocaleDateString('pt-PT');
      return '<option value="' + f.id + '"' + (f.id === selectedId ? ' selected' : '') + '>' + esc(label) + '</option>';
    }).join('');
    row.style.display = 'block';
  }

  function loadAndRenderDriveFile(file, isLatest){
    return downloadDriveFile(file.id).then(function(text){
      var data = parseTrainingFile(text);
      var record = { updatedAt: new Date(file.modifiedTime).getTime(), sourceName: file.name + ' (Drive)', data: data };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(record));
      renderAll();
      document.getElementById('historyBanner').style.display = isLatest ? 'none' : 'block';
    });
  }

  function syncDrive(interactive){
    var btn = document.getElementById('driveBtn');
    btn.textContent = '...';
    return ensureDriveToken()
      .then(function(){ return findCiclismoFolder(); })
      .then(function(folderId){ return listCiclismoFiles(folderId); })
      .then(function(files){
        btn.textContent = 'Drive'; btn.classList.add('connected');
        if (!files.length){ toast('Pasta "ciclismo" está vazia no Drive'); return; }
        populateWeekPicker(files, files[0].id);
        return loadAndRenderDriveFile(files[0], true);
      })
      .then(function(){ toast('Sincronizado com o Drive'); })
      .catch(function(err){
        btn.textContent = 'Drive';
        if (err && err.message === 'folder-not-found'){ toast('Cria uma pasta "ciclismo" no teu Drive'); }
        else if (interactive){ toast('Não foi possível ligar ao Drive'); }
      });
  }

  document.getElementById('driveBtn').addEventListener('click', function(){ syncDrive(true); });

  document.getElementById('weekPicker').addEventListener('change', function(e){
    var file = driveFiles.find(function(f){ return f.id === e.target.value; });
    if (!file) return;
    var isLatest = driveFiles.length && file.id === driveFiles[0].id;
    loadAndRenderDriveFile(file, isLatest);
  });

  document.getElementById('backToLatestBtn').addEventListener('click', function(){
    if (driveFiles.length){
      document.getElementById('weekPicker').value = driveFiles[0].id;
      loadAndRenderDriveFile(driveFiles[0], true);
    }
  });

  // silent sync on load if a valid token already exists
  if (getCachedDriveToken()) syncDrive(false);

  /* ---------------- PWA setup ---------------- */
  if ('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }

  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('installBtn').style.display = 'inline-block';
  });
  var installBtn = document.getElementById('installBtn');
  if (installBtn) installBtn.addEventListener('click', function(){
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.finally(function(){
      deferredPrompt = null;
      installBtn.style.display = 'none';
    });
  });
  window.addEventListener('appinstalled', function(){
    if (installBtn) installBtn.style.display = 'none';
    toast('App instalada');
  });

  renderAll();
})();
</script>
</body>
</html>
