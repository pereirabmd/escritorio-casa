<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Convidados</title>
<meta name="theme-color" content="#EFE7D2">
<style>
  :root{
    --bg:#F5EFDE;
    --card:#FFFFFF;
    --primary:#6B7F63;
    --primary-dark:#4F5F49;
    --text:#3A3F35;
    --muted:#8B9385;
    --border:#DCD3BC;
    --header-bg:#EFE7D2;
    --chip-bg:#EDE6D2;
    --modal-overlay:rgba(58,63,53,0.45);
    --danger:#B85C4A;

    --c-porconvidar-bg:#EDE9DD; --c-porconvidar-fg:#8B8064;
    --c-convidado-bg:#DCE6EF;   --c-convidado-fg:#4A6E8C;
    --c-confirmado-bg:#DEEBDF; --c-confirmado-fg:#4A7F52;
    --c-recusado-bg:#F3DEDA;   --c-recusado-fg:#B85C4A;
    --c-semresposta-bg:#F1E7CE; --c-semresposta-fg:#A2842F;
  }
  html.dark{
    --bg:#232821;
    --card:#2E342B;
    --primary:#8FA085;
    --primary-dark:#B4C2AB;
    --text:#E8E9E2;
    --muted:#9AA394;
    --border:#3E453A;
    --header-bg:#1D211B;
    --chip-bg:#333A2F;
    --modal-overlay:rgba(0,0,0,0.6);
    --danger:#E08772;

    --c-porconvidar-bg:#3A3C30; --c-porconvidar-fg:#C9BE9B;
    --c-convidado-bg:#2C3A47;   --c-convidado-fg:#8FBBDE;
    --c-confirmado-bg:#2C3E30; --c-confirmado-fg:#8FCB98;
    --c-recusado-bg:#43302C;   --c-recusado-fg:#E29685;
    --c-semresposta-bg:#3C3623; --c-semresposta-fg:#D9BE66;
  }
  html.dark{ background:var(--bg); }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text);
    height:100vh; height:100dvh; overflow:hidden;
    display:flex; flex-direction:column;
  }
  #app{ display:flex; flex-direction:column; height:100%; max-width:560px; margin:0 auto; width:100%; position:relative;}

  header.top{
    background:var(--header-bg); padding:14px 16px 10px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--border); flex-shrink:0;
  }
  header.top h1{ font-size:19px; margin:0; font-weight:700; color:var(--primary-dark); letter-spacing:.2px;}
  .header-left{ display:flex; align-items:center; gap:9px; }
  .header-logo{ width:30px; height:30px; border-radius:50%; flex-shrink:0; object-fit:cover; }
  .icon-btn{
    background:none; border:none; padding:6px; cursor:pointer; color:var(--text); display:flex; align-items:center; justify-content:center; border-radius:8px;
  }
  .icon-btn:active{ background:var(--chip-bg); }
  .icon-btn svg{ width:20px; height:20px; }
  .top-actions{ display:flex; gap:2px; align-items:center;}

  nav.tabs{ display:flex; flex-shrink:0; background:var(--header-bg); border-bottom:1px solid var(--border);}
  nav.tabs button{
    flex:1; padding:10px 6px; background:none; border:none; font-size:13.5px; font-weight:600; color:var(--muted);
    border-bottom:2px solid transparent; cursor:pointer; font-family:inherit;
  }
  nav.tabs button.active{ color:var(--primary-dark); border-bottom-color:var(--primary);}

  main{ flex:1; overflow:hidden; position:relative;}
  .tabpanel{ position:absolute; inset:0; display:none; flex-direction:column; overflow:hidden;}
  .tabpanel.active{ display:flex; }

  .toolbar{ padding:10px 14px; display:flex; gap:8px; flex-shrink:0; flex-wrap:wrap;}
  .search-wrap{ position:relative; flex:1 1 100%; }
  .search-wrap svg{ position:absolute; left:10px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--muted);}
  input[type=text].search{
    width:100%; padding:9px 10px 9px 32px; border-radius:10px; border:1px solid var(--border); background:var(--card);
    color:var(--text); font-size:14px; font-family:inherit;
  }
  .chip-row{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; flex:1 1 100%; }
  .chip-row::-webkit-scrollbar{ display:none;}
  select.chip{
    border:1px solid var(--border); background:var(--chip-bg); color:var(--text); border-radius:20px;
    padding:6px 10px; font-size:12.5px; font-family:inherit; flex-shrink:0;
  }

  .pull-zone{ flex:1; position:relative; overflow:hidden; }
  .pull-indicator{
    position:absolute; top:0; left:0; right:0; height:56px; display:flex; align-items:center; justify-content:center;
    opacity:0; z-index:1; pointer-events:none;
  }
  .list{ position:relative; z-index:2; background:var(--bg); height:100%; overflow-y:auto; padding:4px 14px 90px; -webkit-overflow-scrolling:touch;}
  .empty-state{ text-align:center; color:var(--muted); font-size:13.5px; padding:40px 20px; }

  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px 14px; margin-bottom:9px;
    cursor:pointer; transition:transform .1s;
  }
  .card:active{ transform:scale(0.985); }
  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .card-name{ font-weight:700; font-size:15px; color:var(--text); }
  .card-people{ font-size:12.5px; color:var(--muted); margin-top:2px;}
  .badges{ display:flex; gap:5px; margin-top:8px; flex-wrap:wrap;}
  .badge{ font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap;}
  .card-notes{ font-size:12px; color:var(--muted); margin-top:6px; font-style:italic; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  .fab{
    position:absolute; right:18px; bottom:22px; width:54px; height:54px; border-radius:50%; background:var(--primary);
    color:#fff; border:none; box-shadow:0 4px 14px rgba(0,0,0,0.25); display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:5;
  }
  .fab svg{ width:24px; height:24px;}

  /* RESUMO */
  .resumo-scroll{ position:relative; z-index:2; background:var(--bg); height:100%; overflow-y:auto; padding:14px 16px 30px; -webkit-overflow-scrolling:touch;}
  .headline-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;}
  .headline-card{ background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; text-align:center;}
  .headline-num{ font-size:26px; font-weight:800; color:var(--primary-dark); line-height:1.1;}
  .headline-label{ font-size:11.5px; color:var(--muted); margin-top:4px; font-weight:600;}

  .section-title{ font-size:13px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin:18px 0 8px;}
  .breakdown-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border);}
  .breakdown-row:last-child{ border-bottom:none;}
  .breakdown-label{ font-size:13px; font-weight:600; width:100px; flex-shrink:0;}
  .breakdown-bar-wrap{ flex:1; height:8px; background:var(--chip-bg); border-radius:6px; overflow:hidden;}
  .breakdown-bar{ height:100%; background:var(--primary); border-radius:6px;}
  .breakdown-num{ font-size:12.5px; color:var(--muted); width:70px; text-align:right; flex-shrink:0;}

  .export-btn{
    width:100%; margin-top:20px; padding:11px; border-radius:12px; border:1px solid var(--border); background:var(--card);
    color:var(--primary-dark); font-weight:700; font-size:13.5px; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; font-family:inherit;
  }
  .export-btn svg{ width:16px; height:16px;}

  /* MODAL */
  .modal-overlay{
    position:fixed; inset:0; background:var(--modal-overlay); z-index:20; display:none; align-items:flex-end; justify-content:center;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    background:var(--bg); width:100%; max-width:560px; border-radius:20px 20px 0 0; padding:16px 18px 20px; max-height:88vh; overflow-y:auto;
  }
  .modal h2{ font-size:17px; margin:2px 0 14px; color:var(--primary-dark);}
  .field{ margin-bottom:12px;}
  .field label{ display:block; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:4px;}
  .field input, .field select, .field textarea{
    width:100%; padding:10px 11px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--text);
    font-size:14.5px; font-family:inherit;
  }
  .field textarea{ resize:none; height:56px;}
  .field-row{ display:flex; gap:10px;}
  .field-row .field{ flex:1;}
  .modal-actions{ display:flex; gap:10px; margin-top:16px;}
  .btn{
    flex:1; padding:12px; border-radius:12px; border:none; font-weight:700; font-size:14px; cursor:pointer; font-family:inherit;
  }
  .btn-primary{ background:var(--primary); color:#fff;}
  .btn-secondary{ background:var(--chip-bg); color:var(--text);}
  .btn-danger{ background:none; color:var(--danger); border:1px solid var(--danger); flex:0 0 auto; padding:12px 16px;}

  /* AUTH SCREEN */
  .auth-screen{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px; text-align:center; gap:16px;}
  .auth-screen img{ width:64px; height:64px; border-radius:50%;}
  .auth-screen p{ color:var(--muted); font-size:13.5px; max-width:280px; line-height:1.5;}

  footer.appfoot{
    flex-shrink:0; display:flex; flex-direction:column; align-items:center; padding:8px 0 10px; gap:2px; background:var(--bg);
  }
  footer.appfoot img{ width:26px; height:26px; opacity:.85; border-radius:50%;}
  footer.appfoot span{ font-size:10.5px; color:var(--muted); font-weight:600;}

  .toast{
    position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--primary-dark); color:#fff; padding:9px 16px;
    border-radius:20px; font-size:13px; z-index:30; opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .toast.show{ opacity:1;}

  .spinner{ width:28px; height:28px; border:3px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin 0.8s linear infinite;}
  @keyframes spin{ to{ transform:rotate(360deg);} }

  @media print{
    body *{ visibility:hidden; }
    #print-area, #print-area *{ visibility:visible; }
    #print-area{ position:absolute; top:0; left:0; width:100%; padding:20px; }
  }
  #print-area{ display:none; }
</style>
</head>

<script>
(function(){
"use strict";

// ---------- CONFIG ----------
const CLIENT_ID = "108256538530-fgunbb52s7f3s9aurfpjtaf01v8fjbph.apps.googleusercontent.com";
const SHEET_ID  = "1UcjSO3P7RbreTtKeg4T8jsoRa2KwzTEPE4Wsrkf2Eos";
const SCOPE     = "https://www.googleapis.com/auth/spreadsheets";
const TOKEN_KEY = "convidados.token";
const DARK_KEY  = "convidados.dark";
const RANGE_CONFIG = "Config!A2:B50";
const RANGE_GUESTS = "Convidados!A2:F1000";
const SHEETS_BASE = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}`;

let tokenClient = null;
let accessToken = null;
let fases = [];
let estados = [];
let guests = []; // {row, nome, pessoas, confirmados, fase, estado, notas}
let guestsSheetGid = null;
let nextFreeRow = 2;

// ---------- DOM ----------
const $ = (id) => document.getElementById(id);
const authPanel = $("authPanel"), authSpinner = $("authSpinner"), authContent = $("authContent");
const tabConvidados = $("tab-convidados"), tabResumo = $("tab-resumo");
const guestListEl = $("guestList");
const searchInput = $("searchInput");
const filterEstado = $("filterEstado"), filterFase = $("filterFase");
const modalOverlay = $("modalOverlay"), modalTitle = $("modalTitle");
const f_nome = $("f_nome"), f_pessoas = $("f_pessoas"), f_confirmados = $("f_confirmados"),
      f_fase = $("f_fase"), f_estado = $("f_estado"), f_notas = $("f_notas");
const deleteBtn = $("deleteBtn"), saveBtn = $("saveBtn"), cancelBtn = $("cancelBtn"), addBtn = $("addBtn");
const toastEl = $("toast");
let editingRow = null; // null = new guest

// ---------- DARK MODE ----------
function applyDark(on){
  document.documentElement.classList.toggle("dark", on);
  localStorage.setItem(DARK_KEY, on ? "1" : "0");
}
applyDark(localStorage.getItem(DARK_KEY) === "1");
$("darkToggle").addEventListener("click", () => {
  applyDark(!document.documentElement.classList.contains("dark"));
});

// ---------- TABS ----------
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    document.querySelectorAll(".tabpanel").forEach(p => p.classList.remove("active"));
    if(btn.dataset.tab === "convidados"){ tabConvidados.classList.add("active"); }
    else { tabResumo.classList.add("active"); renderResumo(); }
  });
});

// ---------- TOAST ----------
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  setTimeout(() => toastEl.classList.remove("show"), 2200);
}

// ---------- AUTH ----------
function showAuthScreen(){
  authPanel.style.display = "flex";
  document.querySelectorAll(".tabpanel").forEach(p => { if(p !== authPanel) p.classList.remove("active"); });
  authPanel.classList.add("active");
  document.querySelector("nav.tabs").style.display = "none";
}
function hideAuthScreen(){
  authPanel.style.display = "none";
  document.querySelector("nav.tabs").style.display = "flex";
  tabConvidados.classList.add("active");
}

function getCachedToken(){
  try{
    const raw = localStorage.getItem(TOKEN_KEY);
    if(!raw) return null;
    const t = JSON.parse(raw);
    if(t.scope !== SCOPE) return null;
    if(Date.now() > t.expires_at - 60000) return null;
    return t.access_token;
  }catch(e){ return null; }
}
function cacheToken(access_token, expires_in){
  localStorage.setItem(TOKEN_KEY, JSON.stringify({
    access_token, scope: SCOPE, expires_at: Date.now() + expires_in * 1000
  }));
}

function initAuth(){
  showAuthScreen();
  const cached = getCachedToken();
  if(cached){
    accessToken = cached;
    authSpinner.style.display = "none";
    startApp();
    return;
  }
  authSpinner.style.display = "none";
  authContent.style.display = "block";
}

function requestToken(){
  authSpinner.style.display = "block";
  authContent.style.display = "none";
  if(!tokenClient){
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPE,
      callback: (resp) => {
        if(resp.error){
          authSpinner.style.display = "none";
          authContent.style.display = "block";
          toast("Erro ao iniciar sessão");
          return;
        }
        accessToken = resp.access_token;
        cacheToken(resp.access_token, resp.expires_in || 3600);
        startApp();
      }
    });
  }
  tokenClient.requestAccessToken({ prompt: getCachedToken() ? "" : "consent" });
}
$("signInBtn").addEventListener("click", requestToken);

async function authedFetch(url, options){
  options = options || {};
  options.headers = Object.assign({}, options.headers, { "Authorization": "Bearer " + accessToken });
  let res = await fetch(url, options);
  if(res.status === 401){
    localStorage.removeItem(TOKEN_KEY);
    accessToken = null;
    showAuthScreen();
    authSpinner.style.display = "none";
    authContent.style.display = "block";
    throw new Error("Sessão expirada");
  }
  return res;
}

// ---------- START APP ----------
let pullToRefreshAttached = false;
async function startApp(){
  hideAuthScreen();
  try{
    await Promise.all([loadConfig(), loadGuests(), loadSheetMeta()]);
    populateFilters();
    populateFormSelects();
    renderList();
    if(!pullToRefreshAttached){
      attachPullToRefresh($("guestList"), $("guestsPullIndicator"), refreshAll);
      attachPullToRefresh(document.querySelector(".resumo-scroll"), $("resumoPullIndicator"), refreshAll);
      pullToRefreshAttached = true;
    }
  }catch(e){
    console.error(e);
    toast("Erro ao carregar dados");
  }
}

// Reloads guest data (and config) and re-renders whichever tab is visible.
// Used after every insert/edit/delete, by the manual refresh button, and by pull-to-refresh.
async function refreshAll(){
  await Promise.all([loadConfig(), loadGuests()]);
  populateFilters();
  populateFormSelects();
  renderList();
  if(tabResumo.classList.contains("active")) renderResumo();
}

$("refreshBtn").addEventListener("click", async () => {
  if(!accessToken) return;
  try{
    await refreshAll();
    toast("Atualizado");
  }catch(e){ console.error(e); toast("Erro ao atualizar"); }
});

// ---------- SHEET METADATA (needed for real row deletion) ----------
async function loadSheetMeta(){
  const res = await authedFetch(`${SHEETS_BASE}?fields=sheets.properties`);
  const data = await res.json();
  const sheet = (data.sheets || []).find(s => s.properties.title === "Convidados");
  guestsSheetGid = sheet ? sheet.properties.sheetId : 0;
}

// ---------- DATA: CONFIG ----------
async function loadConfig(){
  const res = await authedFetch(`${SHEETS_BASE}/values/${encodeURIComponent(RANGE_CONFIG)}`);
  const data = await res.json();
  const rows = data.values || [];
  fases = rows.map(r => r[0]).filter(Boolean);
  estados = rows.map(r => r[1]).filter(Boolean);
}

// ---------- DATA: GUESTS ----------
async function loadGuests(){
  const res = await authedFetch(`${SHEETS_BASE}/values/${encodeURIComponent(RANGE_GUESTS)}`);
  const data = await res.json();
  const rows = data.values || [];
  guests = [];
  rows.forEach((r, i) => {
    const nome = (r[0] || "").trim();
    if(!nome) return;
    guests.push({
      row: i + 2,
      nome,
      pessoas: parseInt(r[1]) || 0,
      confirmados: parseInt(r[2]) || 0,
      fase: r[3] || "",
      estado: r[4] || "",
      notas: r[5] || ""
    });
  });
  // The Sheets API trims trailing empty rows from the response, so rows.length
  // reflects the true last used row. The next new guest goes right after it.
  nextFreeRow = rows.length + 2;
}

// ---------- FILTERS / SELECTS ----------
function populateFilters(){
  filterEstado.innerHTML = '<option value="">Todos os estados</option>' + estados.map(e => `<option value="${escapeHtml(e)}">${escapeHtml(e)}</option>`).join("");
  filterFase.innerHTML = '<option value="">Todas as fases</option>' + fases.map(f => `<option value="${escapeHtml(f)}">${escapeHtml(f)}</option>`).join("");
}
function populateFormSelects(){
  f_fase.innerHTML = fases.map(f => `<option value="${escapeHtml(f)}">${escapeHtml(f)}</option>`).join("");
  f_estado.innerHTML = estados.map(e => `<option value="${escapeHtml(e)}">${escapeHtml(e)}</option>`).join("");
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// ---------- BADGE COLOR MAP ----------
function badgeClass(estado){
  const map = {
    "Por convidar": "porconvidar",
    "Convidado": "convidado",
    "Confirmado": "confirmado",
    "Recusado": "recusado",
    "Sem resposta": "semresposta"
  };
  return map[estado] || "porconvidar";
}

// ---------- RENDER LIST ----------
function currentFiltered(){
  const q = searchInput.value.trim().toLowerCase();
  const est = filterEstado.value;
  const fase = filterFase.value;
  return guests.filter(g => {
    if(q && !g.nome.toLowerCase().includes(q)) return false;
    if(est && g.estado !== est) return false;
    if(fase && g.fase !== fase) return false;
    return true;
  });
}

function renderList(){
  const filtered = currentFiltered();
  if(filtered.length === 0){
    guestListEl.innerHTML = '<div class="empty-state">Nenhum convidado encontrado.</div>';
    return;
  }
  guestListEl.innerHTML = filtered.map(g => {
    const cls = badgeClass(g.estado);
    return `
    <div class="card" data-row="${g.row}">
      <div class="card-top">
        <div>
          <div class="card-name">${escapeHtml(g.nome)}</div>
          <div class="card-people">${g.confirmados}/${g.pessoas} pessoas confirmadas</div>
        </div>
      </div>
      <div class="badges">
        ${g.fase ? `<span class="badge" style="background:var(--chip-bg);color:var(--muted);">${escapeHtml(g.fase)}</span>` : ""}
        <span class="badge" style="background:var(--c-${cls}-bg);color:var(--c-${cls}-fg);">${escapeHtml(g.estado)}</span>
      </div>
      ${g.notas ? `<div class="card-notes">${escapeHtml(g.notas)}</div>` : ""}
    </div>`;
  }).join("");
  guestListEl.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", () => openEdit(parseInt(card.dataset.row)));
  });
}
searchInput.addEventListener("input", renderList);
filterEstado.addEventListener("change", renderList);
filterFase.addEventListener("change", renderList);

// ---------- MODAL: ADD / EDIT ----------
function openAdd(){
  editingRow = null;
  modalTitle.textContent = "Novo Convidado";
  f_nome.value = ""; f_pessoas.value = ""; f_confirmados.value = "";
  f_fase.value = fases[0] || ""; f_estado.value = estados[0] || "Por convidar";
  f_notas.value = "";
  deleteBtn.style.display = "none";
  modalOverlay.classList.add("open");
  setTimeout(() => f_nome.focus(), 100);
}
function openEdit(row){
  const g = guests.find(x => x.row === row);
  if(!g) return;
  editingRow = row;
  modalTitle.textContent = "Editar Convidado";
  f_nome.value = g.nome; f_pessoas.value = g.pessoas; f_confirmados.value = g.confirmados;
  f_fase.value = g.fase; f_estado.value = g.estado; f_notas.value = g.notas;
  deleteBtn.style.display = "flex";
  modalOverlay.classList.add("open");
}
function closeModal(){ modalOverlay.classList.remove("open"); }
addBtn.addEventListener("click", openAdd);
cancelBtn.addEventListener("click", closeModal);
modalOverlay.addEventListener("click", (e) => { if(e.target === modalOverlay) closeModal(); });

saveBtn.addEventListener("click", async () => {
  const nome = f_nome.value.trim();
  if(!nome){ toast("Indica um nome"); return; }
  const pessoas = parseInt(f_pessoas.value) || 0;
  const confirmados = parseInt(f_confirmados.value) || 0;
  const fase = f_fase.value;
  const estado = f_estado.value;
  const notas = f_notas.value.trim();
  const values = [[nome, pessoas, confirmados, fase, estado, notas]];

  saveBtn.disabled = true;
  try{
    const targetRow = editingRow || nextFreeRow;
    await authedFetch(`${SHEETS_BASE}/values/Convidados!A${targetRow}:F${targetRow}?valueInputOption=USER_ENTERED`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ values })
    });
    closeModal();
    await refreshAll();
    toast("Guardado");
  }catch(e){
    console.error(e);
    toast("Erro ao guardar");
  }finally{
    saveBtn.disabled = false;
  }
});

deleteBtn.addEventListener("click", async () => {
  if(!editingRow) return;
  if(!confirm("Remover este convidado?")) return;
  try{
    await authedFetch(`${SHEETS_BASE}:batchUpdate`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        requests: [{
          deleteDimension: {
            range: {
              sheetId: guestsSheetGid,
              dimension: "ROWS",
              startIndex: editingRow - 1, // 0-indexed
              endIndex: editingRow
            }
          }
        }]
      })
    });
    closeModal();
    await refreshAll();
    toast("Removido");
  }catch(e){
    console.error(e);
    toast("Erro ao remover");
  }
});

// ---------- RESUMO ----------
function renderResumo(){
  const totalPrevisto = guests.reduce((s, g) => s + g.pessoas, 0);
  const totalConfirmado = guests.reduce((s, g) => s + g.confirmados, 0);
  const totalRecusado = guests.filter(g => g.estado === "Recusado").reduce((s, g) => s + g.pessoas, 0);
  const totalSemResposta = guests.filter(g => g.estado === "Sem resposta").reduce((s, g) => s + g.pessoas, 0);

  $("headlineGrid").innerHTML = [
    ["Previsto", totalPrevisto],
    ["Confirmado", totalConfirmado],
    ["Recusado", totalRecusado],
    ["Sem resposta", totalSemResposta]
  ].map(([label, num]) => `
    <div class="headline-card">
      <div class="headline-num">${num}</div>
      <div class="headline-label">${label}</div>
    </div>`).join("");

  const maxPessoas = Math.max(1, totalPrevisto);
  $("estadoBreakdown").innerHTML = estados.map(est => {
    const pessoas = guests.filter(g => g.estado === est).reduce((s, g) => s + g.pessoas, 0);
    const pct = Math.round((pessoas / maxPessoas) * 100);
    return breakdownRow(est, pessoas, pct);
  }).join("");

  $("faseBreakdown").innerHTML = fases.map(fase => {
    const pessoas = guests.filter(g => g.fase === fase).reduce((s, g) => s + g.pessoas, 0);
    const pct = Math.round((pessoas / maxPessoas) * 100);
    return breakdownRow(fase, pessoas, pct);
  }).join("");
}
function breakdownRow(label, pessoas, pct){
  return `<div class="breakdown-row">
    <div class="breakdown-label">${escapeHtml(label)}</div>
    <div class="breakdown-bar-wrap"><div class="breakdown-bar" style="width:${pct}%"></div></div>
    <div class="breakdown-num">${pessoas} pessoas</div>
  </div>`;
}

// ---------- EXPORT / PRINT ----------
$("exportBtn").addEventListener("click", () => {
  const sorted = [...guests].sort((a, b) => a.nome.localeCompare(b.nome, "pt"));
  const rows = sorted.map(g => `<tr>
      <td style="padding:6px 10px;border-bottom:1px solid #ddd;">${escapeHtml(g.nome)}</td>
      <td style="padding:6px 10px;border-bottom:1px solid #ddd;text-align:center;">${g.pessoas}</td>
      <td style="padding:6px 10px;border-bottom:1px solid #ddd;text-align:center;">${g.confirmados}</td>
      <td style="padding:6px 10px;border-bottom:1px solid #ddd;">${escapeHtml(g.estado)}</td>
    </tr>`).join("");
  const totalPessoas = sorted.reduce((s,g)=>s+g.pessoas,0);
  const totalConf = sorted.reduce((s,g)=>s+g.confirmados,0);
  $("print-area").innerHTML = `
    <h2 style="font-family:Arial,sans-serif;">Lista de Convidados</h2>
    <table style="width:100%;border-collapse:collapse;font-family:Arial,sans-serif;font-size:13px;">
      <thead><tr>
        <th style="text-align:left;padding:6px 10px;border-bottom:2px solid #333;">Nome</th>
        <th style="padding:6px 10px;border-bottom:2px solid #333;">Pessoas</th>
        <th style="padding:6px 10px;border-bottom:2px solid #333;">Confirmados</th>
        <th style="text-align:left;padding:6px 10px;border-bottom:2px solid #333;">Estado</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <p style="font-family:Arial,sans-serif;font-size:13px;margin-top:14px;">Total: ${totalPessoas} pessoas previstas · ${totalConf} confirmadas</p>
  `;
  window.print();
});

// ---------- PULL TO REFRESH ----------
// Native pull-to-refresh doesn't work in standalone PWA mode on Android, so this
// implements the gesture manually. Only activates when the scrollable list is
// already at its top, so it never fights with normal scrolling of the list itself.
function attachPullToRefresh(scrollEl, indicatorEl, onRefresh){
  const THRESHOLD = 62;
  let startY = null, pulling = false, refreshing = false;

  scrollEl.addEventListener("touchstart", (e) => {
    if(refreshing) return;
    if(scrollEl.scrollTop <= 0){
      startY = e.touches[0].clientY;
      pulling = true;
    } else {
      startY = null;
      pulling = false;
    }
  }, { passive: true });

  scrollEl.addEventListener("touchmove", (e) => {
    if(!pulling || startY === null || refreshing) return;
    if(scrollEl.scrollTop > 0){ pulling = false; return; } // guard: real scroll took over
    const delta = e.touches[0].clientY - startY;
    if(delta <= 0) return;
    e.preventDefault();
    const dist = Math.min(delta * 0.5, 90);
    scrollEl.style.transform = `translateY(${dist}px)`;
    indicatorEl.style.opacity = Math.min(dist / THRESHOLD, 1);
    indicatorEl.style.transform = `translateY(${dist - 40}px)`;
  }, { passive: false });

  scrollEl.addEventListener("touchend", async () => {
    if(!pulling || refreshing) { pulling = false; return; }
    pulling = false;
    const currentDist = parseFloat((scrollEl.style.transform.match(/-?\d+\.?\d*/) || [0])[0]) || 0;
    if(currentDist >= THRESHOLD){
      refreshing = true;
      scrollEl.style.transition = "transform .15s";
      scrollEl.style.transform = `translateY(44px)`;
      indicatorEl.style.opacity = 1;
      indicatorEl.style.transform = `translateY(4px)`;
      try{ await onRefresh(); toast("Atualizado"); }
      catch(e){ console.error(e); toast("Erro ao atualizar"); }
      finally{
        scrollEl.style.transform = "";
        indicatorEl.style.opacity = 0;
        setTimeout(() => { scrollEl.style.transition = ""; }, 200);
        refreshing = false;
      }
    } else {
      scrollEl.style.transition = "transform .2s";
      scrollEl.style.transform = "";
      indicatorEl.style.opacity = 0;
      setTimeout(() => { scrollEl.style.transition = ""; }, 200);
    }
  }, { passive: true });
}

// ---------- INIT ----------
window.addEventListener("load", () => {
  const check = setInterval(() => {
    if(window.google && google.accounts){
      clearInterval(check);
      initAuth();
    }
  }, 100);
});

})();
</script>
