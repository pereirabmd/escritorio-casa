<style>
  :root{
    --terracota:#D85C3A;
    --terracota-2:#C24E30;
    --creme:#FFF8ED;
    --oliva:#667A45;
    --oliva-2:#7C9457;
    --carvao:#24231F;
    --bege:#E9DDCC;
    --bg: var(--creme);
    --surface: #FFFFFF;
    --surface-2: var(--bege);
    --text: var(--carvao);
    --text-muted: #6B665A;
    --accent: var(--terracota);
    --accent-2: var(--oliva);
    --border: #E3D8C4;
    --shadow: 0 2px 10px rgba(36,35,31,0.08);
    --radius: 18px;
    --font-display: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  html.dark{
    --bg:#1B1A16;
    --surface:#262420;
    --surface-2:#302D26;
    --text:#F3ECDD;
    --text-muted:#B8B0A0;
    --accent:#E8734F;
    --accent-2:#8CA663;
    --border:#3A362D;
    --shadow: 0 2px 14px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; overflow:hidden; overscroll-behavior:none;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    transition:background .2s ease, color .2s ease;
  }
  #app{
    position:fixed; top:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:560px;
    height:100vh; height:100dvh;
    display:flex; flex-direction:column;
    background:var(--bg);
    overflow:hidden;
  }

  /* Header */
  header.topbar{
    flex-shrink:0;
    display:flex; align-items:center; gap:10px;
    padding:14px 16px 10px;
    background:var(--bg);
  }
  header.topbar img.brand{width:34px; height:34px; border-radius:9px; flex-shrink:0;}
  header.topbar h1{font-family:var(--font-display); font-size:22px; margin:0; flex:1; letter-spacing:.2px;}
  .icon-btn{
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
  }
  .icon-btn svg{width:19px; height:19px;}

  /* Screens wrapper: each child screen owns its own independent scroll */
  .screens{flex:1; position:relative; min-height:0; overflow:hidden;}
  .screen{
    position:absolute; inset:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain; display:none;
  }
  .screen.visible{display:block;}

  /* Search + filters */
  .controls{padding: 2px 16px 10px;}
  .search-box{
    display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:10px 14px; margin-bottom:10px;
  }
  .search-box svg{width:16px; height:16px; color:var(--text-muted); flex-shrink:0;}
  .search-box input{
    border:none; outline:none; background:transparent; color:var(--text);
    font-size:15px; width:100%; font-family:var(--font-body);
  }
  .chip-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none;}
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0; padding:6px 14px; border-radius:999px; font-size:13px; font-weight:600;
    background:var(--surface); border:1px solid var(--border); color:var(--text-muted);
    cursor:pointer; white-space:nowrap; transition:.15s;
  }
  .chip.active{background:var(--accent); border-color:var(--accent); color:#fff;}

  /* Grid */
  main{flex:1; padding: 4px 16px 100px; position:relative;}
  .grid{
    display:grid; grid-template-columns: 1fr 1fr; gap:14px;
  }
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius: 16px;
    padding:14px 14px 12px; cursor:pointer; box-shadow:var(--shadow);
    display:flex; flex-direction:column; min-height:132px; position:relative;
    transition: transform .15s ease;
  }
  .card:active{transform:scale(0.97);}
  .card-delete-btn{
    position:absolute; top:8px; right:8px; width:26px; height:26px; border-radius:50%;
    background:var(--surface); border:1px solid var(--border); color:var(--text-muted);
    display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:2;
    opacity:.75; transition:.15s;
  }
  .card-delete-btn:active{transform:scale(0.9); opacity:1; color:#C24E30; border-color:#C24E30;}
  .card-delete-btn svg{width:13px; height:13px;}
  .card .eyebrow{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--accent-2); font-weight:700; margin-bottom:6px;}
  .card .rule{height:2px; width:30px; background:var(--accent); border-radius:2px; margin-bottom:8px;}
  .card h3{font-family:var(--font-display); font-size:16.5px; line-height:1.25; margin:0 0 6px; font-weight:700;}
  .card p.desc{font-size:12px; color:var(--text-muted); margin:0; line-height:1.4; flex:1; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .card .meta-row{display:flex; gap:8px; margin-top:8px; font-size:11px; color:var(--text-muted); font-family:var(--font-mono);}

  /* Skeleton */
  .skeleton{
    background:linear-gradient(90deg, var(--surface-2) 25%, var(--border) 37%, var(--surface-2) 63%);
    background-size:400% 100%; animation:shimmer 1.4s ease infinite; border-radius:16px; height:132px;
  }
  @keyframes shimmer{0%{background-position:100% 50%;}100%{background-position:0 50%;}}

  /* Empty state */
  .empty-state{
    text-align:center; padding:60px 24px; color:var(--text-muted);
  }
  .empty-state h2{font-family:var(--font-display); color:var(--text); font-size:19px; margin:0 0 8px;}
  .empty-state p{font-size:14px; line-height:1.5; margin:0 0 18px;}
  .btn-primary{
    background:var(--accent); color:#fff; border:none; border-radius:14px;
    padding:12px 22px; font-size:14.5px; font-weight:700; cursor:pointer;
    box-shadow:0 3px 10px rgba(216,92,58,0.3);
  }
  .btn-primary:active{transform:scale(0.97);}
  .btn-secondary{
    background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:14px;
    padding:12px 22px; font-size:14.5px; font-weight:600; cursor:pointer;
  }

  /* FAB */
  .fab{
    position:fixed; bottom:24px; right:20px; z-index:30;
  }
  .fab button{
    background:var(--accent); color:#fff; border:none; border-radius:50%;
    width:56px; height:56px; box-shadow:0 4px 14px rgba(216,92,58,0.4);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .fab button svg{width:24px; height:24px;}
  .fab button:active{transform:scale(0.95);}

  /* Login screen */
  .login-screen{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:32px; text-align:center; gap:14px;
  }
  .login-screen .bowl-icon{width:76px; height:76px; border-radius:20px; box-shadow:var(--shadow);}
  .login-screen h2{font-family:var(--font-display); font-size:22px; margin:14px 0 4px;}
  .login-screen p{color:var(--text-muted); font-size:14px; max-width:280px; line-height:1.5; margin:0 0 10px;}

  /* Toast */
  #toast{
    position:fixed; bottom:96px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--carvao); color:var(--creme); padding:10px 18px; border-radius:12px;
    font-size:13px; opacity:0; pointer-events:none; transition:.25s; z-index:50; max-width:80%; text-align:center;
  }
  html.dark #toast{background:var(--surface-2); color:var(--text); border:1px solid var(--border);}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* Detail view */
  .detail-top{
    display:flex; align-items:center; gap:10px; padding:14px 16px; position:sticky; top:0; background:var(--bg); z-index:10;
  }
  .detail-top .spacer{flex:1;}
  .detail-card{
    margin:0 16px 24px; background:var(--surface); border-radius:20px; box-shadow:var(--shadow);
    border:1px solid var(--border); overflow:hidden; position:relative;
  }
  .detail-holes{
    position:absolute; left:10px; top:0; bottom:0; width:14px;
    display:flex; flex-direction:column; justify-content:space-evenly; padding:20px 0;
  }
  .detail-holes span{width:10px; height:10px; border-radius:50%; background:var(--bg); border:1px solid var(--border);}
  .detail-inner{padding:26px 22px 26px 40px;}
  .detail-eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--accent-2); font-weight:700; margin-bottom:8px;}
  .detail-title{font-family:var(--font-display); font-size:25px; line-height:1.25; margin:0 0 8px; font-weight:700;}
  .detail-rule{height:3px; width:44px; background:var(--accent); border-radius:2px; margin-bottom:12px;}
  .detail-desc{font-size:14px; color:var(--text-muted); line-height:1.5; margin:0 0 16px;}
  .meta-chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px;}
  .meta-chip{
    background:var(--surface-2); border-radius:10px; padding:7px 11px; font-size:12px;
    font-family:var(--font-mono); color:var(--text); display:flex; flex-direction:column; gap:1px; min-width:64px;
  }
  .meta-chip b{font-size:14px; font-family:var(--font-mono);}
  .meta-chip span{font-size:9.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; font-family:var(--font-body);}

  .block-title{font-family:var(--font-display); font-size:16px; font-weight:700; margin:22px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--border);}
  ul.ingredient-list{list-style:none; margin:0; padding:0;}
  ul.ingredient-list li{
    display:flex; align-items:baseline; gap:8px; padding:7px 0; font-size:14.5px; border-bottom:1px dashed var(--border);
    cursor:pointer;
  }
  ul.ingredient-list li:last-child{border-bottom:none;}
  ul.ingredient-list li .qty{font-family:var(--font-mono); font-weight:700; color:var(--accent); min-width:auto; white-space:nowrap;}
  ul.ingredient-list li .unit{font-family:var(--font-mono); color:var(--text-muted); white-space:nowrap;}
  ul.ingredient-list li .name{flex:1;}
  ul.ingredient-list li.done{opacity:.4; text-decoration:line-through;}

  ol.steps-list{list-style:none; margin:0; padding:0; counter-reset:step;}
  ol.steps-list li{
    display:flex; gap:12px; padding:10px 0; font-size:14.5px; line-height:1.5; cursor:pointer; align-items:flex-start;
  }
  ol.steps-list li .num{
    counter-increment:step; flex-shrink:0; width:26px; height:26px; border-radius:50%; background:var(--surface-2);
    color:var(--accent-2); font-family:var(--font-mono); font-weight:700; font-size:12.5px;
    display:flex; align-items:center; justify-content:center; margin-top:1px;
  }
  ol.steps-list li.done{opacity:.45; text-decoration:line-through;}
  ol.steps-list li.done .num{background:var(--accent-2); color:#fff;}

  .notes-block{font-size:14px; line-height:1.6; color:var(--text); background:var(--surface-2); border-radius:12px; padding:14px 16px; margin-top:20px;}
  .extra-block p{font-size:14px; line-height:1.55; margin:4px 0;}
  .tags-row{display:flex; flex-wrap:wrap; gap:7px; margin-top:20px;}
  .tag-pill{background:transparent; border:1px solid var(--accent-2); color:var(--accent-2); font-size:11.5px; font-weight:600; padding:5px 11px; border-radius:999px;}

  .danger-btn{
    background:transparent; border:1px solid #C24E30; color:#C24E30; border-radius:12px; padding:10px 16px;
    font-size:13px; font-weight:600; cursor:pointer; margin-top:26px; width:100%;
  }

  /* Footer */
  footer.appfooter{
    text-align:center; padding:28px 16px 20px; color:var(--text-muted); font-size:11.5px;
  }
  footer.appfooter img{width:26px; height:26px; opacity:.85; display:block; margin:0 auto 6px;}
  footer.appfooter .ver{font-family:var(--font-mono); letter-spacing:.03em;}

  /* Loading overlay for auth */
  .center-spinner{flex:1; display:flex; align-items:center; justify-content:center; padding:60px;}
  .spinner{
    width:30px; height:30px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--accent);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  input[type=file]{display:none;}

  @media (min-width:420px){
    .grid{grid-template-columns: 1fr 1fr;}
  }
</style>
</head>

<script>
(function(){
  "use strict";

  /* ===================== CONFIG ===================== */
  var CLIENT_ID = "108256538530-fgunbb52s7f3s9aurfpjtaf01v8fjbph.apps.googleusercontent.com";
  var SCOPES = "https://www.googleapis.com/auth/drive.file";
  var CACHE_KEY = "receitas.cache.v1";
  var FOLDER_KEY = "receitas.folderId";
  var TOKEN_KEY = "receitas.token";
  var THEME_KEY = "receitas.theme";
  var SCHEMA_VERSION = 1;
  var FOLDER_NAME = "Receitas";

  /* ===================== STATE ===================== */
  var state = {
    accessToken: null,
    tokenExpiresAt: 0,
    tokenClient: null,
    cache: { schemaVersion: SCHEMA_VERSION, folderId: null, files: {} },
    filterCategoria: "Todas",
    searchTerm: "",
    currentDetailId: null
  };

  /* ===================== UTILS ===================== */
  function $(id){ return document.getElementById(id); }

  function toast(msg, ms){
    var el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(el._t);
    el._t = setTimeout(function(){ el.classList.remove("show"); }, ms || 2600);
  }

  function humanize(key){
    return key.toLowerCase().split("_").map(function(w, idx){
      if(w.length === 0) return w;
      return idx === 0 ? (w.charAt(0).toUpperCase() + w.slice(1)) : w;
    }).join(" ");
  }

  function normalizeStr(s){
    return (s || "").toString().normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  }

  function hashRotation(str){
    var h = 0;
    for(var i = 0; i < str.length; i++){ h = (h * 31 + str.charCodeAt(i)) % 1000; }
    var norm = (h / 1000) * 5 - 2.5;
    return norm.toFixed(2);
  }

  function escapeHtml(s){
    if(s === undefined || s === null) return "";
    return s.toString().replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  /* ===================== PARSER ===================== */
  function parseRecipe(rawText){
    var text = rawText.replace(/\r\n/g, "\n");
    var lines = text.split("\n");
    var headerKeyRe = /^([A-ZÀ-ÖØ-Ý0-9_]+):\s*(.*)$/;

    var i = 0;
    var metadata = {};

    while(i < lines.length){
      var line = lines[i];
      if(line.trim() === ""){ i++; break; }
      var m = line.match(headerKeyRe);
      if(m && m[2].trim() !== ""){
        metadata[m[1]] = m[2].trim();
        i++;
      } else if(m && m[2].trim() === ""){
        break;
      } else {
        i++;
      }
    }

    var blocks = [];
    var current = null;
    for(; i < lines.length; i++){
      var l = lines[i];
      var bm = l.match(headerKeyRe);
      if(bm){
        current = { key: bm[1], inline: bm[2].trim(), contentLines: [] };
        if(current.inline) current.contentLines.push(current.inline);
        blocks.push(current);
      } else {
        if(!current) continue;
        current.contentLines.push(l);
      }
    }

    blocks.forEach(function(b){
      while(b.contentLines.length && b.contentLines[0].trim() === "") b.contentLines.shift();
      while(b.contentLines.length && b.contentLines[b.contentLines.length-1].trim() === "") b.contentLines.pop();
    });

    var result = { metadata: metadata, ingredientBlocks: [], steps: [], notes: "", tags: [], extras: [] };

    blocks.forEach(function(b){
      var key = b.key;
      if(key.indexOf("INGREDIENTES") === 0){
        var suffix = key === "INGREDIENTES" ? "" : key.replace(/^INGREDIENTES_?/, "");
        var title = suffix ? humanize(suffix) : "Ingredientes";
        var items = [];
        b.contentLines.forEach(function(l2){
          var t = l2.trim();
          if(!t) return;
          var clean = t.replace(/^-+\s*/, "");
          var parts = clean.split("|").map(function(p){ return p.trim(); });
          if(parts.length >= 3){
            items.push({ qty: parts[0], unit: parts[1], name: parts.slice(2).join(" | ") });
          } else if(parts.length === 2){
            items.push({ qty: parts[0], unit: "", name: parts[1] });
          } else {
            items.push({ qty: "", unit: "", name: parts[0] });
          }
        });
        result.ingredientBlocks.push({ title: title, items: items });
      } else if(key === "PASSOS"){
        b.contentLines.forEach(function(l3){
          var t2 = l3.trim();
          if(!t2) return;
          var sm = t2.match(/^(\d+)[.\)]\s*(.*)$/);
          if(sm){
            result.steps.push(sm[2]);
          } else if(result.steps.length){
            result.steps[result.steps.length - 1] += " " + t2;
          } else {
            result.steps.push(t2);
          }
        });
      } else if(key === "NOTAS"){
        result.notes = b.contentLines.join(" ").replace(/\s+/g, " ").trim();
      } else if(key === "TAGS"){
        var joined = b.contentLines.join(", ");
        result.tags = joined.split(",").map(function(t3){ return t3.trim(); }).filter(Boolean);
      } else {
        var content = b.contentLines.filter(function(l4){ return l4.trim() !== ""; });
        result.extras.push({ title: humanize(key), lines: content });
      }
    });

    return result;
  }

  /* ===================== CACHE ===================== */
  function loadCache(){
    try{
      var raw = localStorage.getItem(CACHE_KEY);
      if(!raw) return { schemaVersion: SCHEMA_VERSION, folderId: null, files: {} };
      var parsed = JSON.parse(raw);
      if(parsed.schemaVersion !== SCHEMA_VERSION){
        return { schemaVersion: SCHEMA_VERSION, folderId: parsed.folderId || null, files: {} };
      }
      return parsed;
    }catch(e){
      return { schemaVersion: SCHEMA_VERSION, folderId: null, files: {} };
    }
  }
  function saveCache(cache){
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); }catch(e){}
  }

  /* ===================== AUTH ===================== */
  function initTokenClient(){
    state.tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPES,
      callback: function(){}
    });
  }

  function loadCachedToken(){
    try{
      var raw = localStorage.getItem(TOKEN_KEY);
      if(!raw) return false;
      var t = JSON.parse(raw);
      if(t.access_token && t.expires_at && t.expires_at > Date.now()){
        state.accessToken = t.access_token;
        state.tokenExpiresAt = t.expires_at;
        return true;
      }
    }catch(e){}
    return false;
  }

  function ensureToken(interactive){
    return new Promise(function(resolve, reject){
      state.tokenClient.callback = function(resp){
        if(resp.error){ reject(resp); return; }
        var expiresAt = Date.now() + (resp.expires_in * 1000) - 60000;
        state.accessToken = resp.access_token;
        state.tokenExpiresAt = expiresAt;
        try{ localStorage.setItem(TOKEN_KEY, JSON.stringify({ access_token: resp.access_token, expires_at: expiresAt })); }catch(e){}
        resolve(resp.access_token);
      };
      state.tokenClient.error_callback = function(err){
        reject(err);
      };
      try{
        state.tokenClient.requestAccessToken({ prompt: interactive ? "consent" : "" });
      }catch(e){ reject(e); }
    });
  }

  function getValidToken(interactiveFallback){
    if(state.accessToken && state.tokenExpiresAt > Date.now() + 30000){
      return Promise.resolve(state.accessToken);
    }
    return ensureToken(false).catch(function(){
      if(interactiveFallback){ return ensureToken(true); }
      throw new Error("auth_required");
    });
  }

  /* ===================== DRIVE ===================== */
  var DRIVE_FILES = "https://www.googleapis.com/drive/v3/files";
  var DRIVE_UPLOAD = "https://www.googleapis.com/upload/drive/v3/files";

  function driveHeaders(token){ return { Authorization: "Bearer " + token }; }

  function ensureFolder(token){
    var cachedId = state.cache.folderId || localStorage.getItem(FOLDER_KEY);
    var checkExisting = cachedId ? fetch(DRIVE_FILES + "/" + cachedId + "?fields=id,trashed", { headers: driveHeaders(token) })
      .then(function(r){ return r.ok ? r.json() : null; })
      .catch(function(){ return null; }) : Promise.resolve(null);

    return checkExisting.then(function(data){
      if(data && !data.trashed){ return cachedId; }
      var q = encodeURIComponent("name='" + FOLDER_NAME + "' and mimeType='application/vnd.google-apps.folder' and trashed=false");
      return fetch(DRIVE_FILES + "?q=" + q + "&fields=files(id,name)", { headers: driveHeaders(token) })
        .then(function(r){ return r.json(); })
        .then(function(sd){
          if(sd.files && sd.files.length){
            localStorage.setItem(FOLDER_KEY, sd.files[0].id);
            return sd.files[0].id;
          }
          return fetch(DRIVE_FILES, {
            method: "POST",
            headers: Object.assign({ "Content-Type": "application/json" }, driveHeaders(token)),
            body: JSON.stringify({ name: FOLDER_NAME, mimeType: "application/vnd.google-apps.folder" })
          }).then(function(r){ return r.json(); }).then(function(cd){
            localStorage.setItem(FOLDER_KEY, cd.id);
            return cd.id;
          });
        });
    });
  }

  function listTxtFiles(folderId, token){
    var q = encodeURIComponent("'" + folderId + "' in parents and trashed=false and (mimeType='text/plain' or name contains '.txt')");
    return fetch(DRIVE_FILES + "?q=" + q + "&fields=files(id,name,modifiedTime)&orderBy=modifiedTime desc&pageSize=1000", { headers: driveHeaders(token) })
      .then(function(r){ return r.json(); })
      .then(function(d){ return d.files || []; });
  }

  function downloadFile(fileId, token){
    return fetch(DRIVE_FILES + "/" + fileId + "?alt=media", { headers: driveHeaders(token) })
      .then(function(r){ if(!r.ok) throw new Error("download_failed"); return r.text(); });
  }

  function deleteFile(fileId, token){
    return fetch(DRIVE_FILES + "/" + fileId, { method: "DELETE", headers: driveHeaders(token) });
  }

  function uploadTxtFile(folderId, file, token){
    return file.text().then(function(text){
      var boundary = "-------receitas" + Date.now() + Math.random().toString(16).slice(2);
      var metadata = { name: file.name, parents: [folderId], mimeType: "text/plain" };
      var body =
        "--" + boundary + "\r\n" +
        "Content-Type: application/json; charset=UTF-8\r\n\r\n" +
        JSON.stringify(metadata) + "\r\n" +
        "--" + boundary + "\r\n" +
        "Content-Type: text/plain; charset=UTF-8\r\n\r\n" +
        text + "\r\n" +
        "--" + boundary + "--";
      return fetch(DRIVE_UPLOAD + "?uploadType=multipart", {
        method: "POST",
        headers: Object.assign({ "Content-Type": "multipart/related; boundary=" + boundary }, driveHeaders(token)),
        body: body
      }).then(function(r){
        if(!r.ok){
          return r.text().then(function(errText){
            var msg = "upload_failed:" + r.status;
            try{
              var parsed = JSON.parse(errText);
              if(parsed && parsed.error && parsed.error.message){ msg += ":" + parsed.error.message; }
            }catch(e){ if(errText){ msg += ":" + errText.slice(0,200); } }
            throw new Error(msg);
          });
        }
        return r.json();
      });
    });
  }

  /* ===================== SYNC ===================== */
  function syncRecipes(){
    return getValidToken(false).then(function(token){
      return ensureFolder(token).then(function(folderId){
        state.cache.folderId = folderId;
        return listTxtFiles(folderId, token).then(function(files){
          var seen = {};
          var changed = false;
          var chain = Promise.resolve();
          files.forEach(function(f){
            seen[f.id] = true;
            var cached = state.cache.files[f.id];
            if(!cached || cached.modifiedTime !== f.modifiedTime){
              chain = chain.then(function(){
                return downloadFile(f.id, token).then(function(text){
                  var parsed = parseRecipe(text);
                  state.cache.files[f.id] = { modifiedTime: f.modifiedTime, name: f.name, parsed: parsed };
                  changed = true;
                }).catch(function(){});
              });
            }
          });
          return chain.then(function(){
            Object.keys(state.cache.files).forEach(function(id){
              if(!seen[id]){ delete state.cache.files[id]; changed = true; }
            });
            if(changed) saveCache(state.cache);
            return changed;
          });
        });
      });
    });
  }

  /* ===================== RENDER: GRID ===================== */
  function getAllRecipes(){
    return Object.keys(state.cache.files).map(function(id){
      var f = state.cache.files[id];
      return { id: id, name: f.name, modifiedTime: f.modifiedTime, parsed: f.parsed };
    }).sort(function(a, b){
      var ta = (a.parsed.metadata.TITULO || a.name || "");
      var tb = (b.parsed.metadata.TITULO || b.name || "");
      return ta.localeCompare(tb, "pt");
    });
  }

  function getFilteredRecipes(){
    var all = getAllRecipes();
    var term = normalizeStr(state.searchTerm);
    return all.filter(function(r){
      var md = r.parsed.metadata;
      if(state.filterCategoria !== "Todas" && (md.CATEGORIA || "Sem categoria") !== state.filterCategoria){
        return false;
      }
      if(!term) return true;
      var haystack = normalizeStr([
        md.TITULO || "", md.DESCRICAO || "", md.CATEGORIA || "", md.SUBCATEGORIA || "",
        (r.parsed.tags || []).join(" ")
      ].join(" "));
      return haystack.indexOf(term) !== -1;
    });
  }

  function renderCategoryChips(){
    var all = getAllRecipes();
    var cats = {};
    all.forEach(function(r){
      var c = r.parsed.metadata.CATEGORIA || "Sem categoria";
      cats[c] = true;
    });
    var list = Object.keys(cats).sort(function(a,b){ return a.localeCompare(b, "pt"); });
    var html = '<div class="chip' + (state.filterCategoria === "Todas" ? " active" : "") + '" data-cat="Todas">Todas</div>';
    list.forEach(function(c){
      html += '<div class="chip' + (state.filterCategoria === c ? " active" : "") + '" data-cat="' + escapeHtml(c) + '">' + escapeHtml(c) + '</div>';
    });
    $("categoryChips").innerHTML = html;
    Array.prototype.forEach.call($("categoryChips").querySelectorAll(".chip"), function(el){
      el.addEventListener("click", function(){
        state.filterCategoria = el.getAttribute("data-cat");
        renderCategoryChips();
        renderGrid();
      });
    });
  }

  function metaChipsForCard(md){
    var parts = [];
    if(md.PORCOES) parts.push(md.PORCOES + " porç.");
    if(md.TEMPO_PREPARO_MIN) parts.push(md.TEMPO_PREPARO_MIN + " min");
    return parts.join(" · ");
  }

  function renderGrid(){
    var filtered = getFilteredRecipes();
    var gridEl = $("grid");
    var emptyEl = $("emptyState");

    if(getAllRecipes().length === 0){
      gridEl.innerHTML = "";
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    if(filtered.length === 0){
      gridEl.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:var(--text-muted); padding:40px 10px; font-size:14px;">Nenhuma receita encontrada.</div>';
      return;
    }

    var html = "";
    filtered.forEach(function(r){
      var md = r.parsed.metadata;
      var title = md.TITULO || r.name.replace(/\.txt$/i, "");
      var eyebrow = [md.CATEGORIA, md.SUBCATEGORIA].filter(Boolean).join(" · ");
      var desc = md.DESCRICAO || "";
      var rot = hashRotation(r.id);
      var metaLine = metaChipsForCard(md);
      html += '<div class="card" style="transform:rotate(' + rot + 'deg)" data-id="' + r.id + '">' +
        '<button class="card-delete-btn" data-del-id="' + r.id + '" aria-label="Eliminar receita" title="Eliminar receita">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"></path><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg>' +
        '</button>' +
        (eyebrow ? '<div class="eyebrow">' + escapeHtml(eyebrow) + '</div>' : "") +
        '<div class="rule"></div>' +
        '<h3>' + escapeHtml(title) + '</h3>' +
        (desc ? '<p class="desc">' + escapeHtml(desc) + '</p>' : '<p class="desc"></p>') +
        (metaLine ? '<div class="meta-row">' + escapeHtml(metaLine) + '</div>' : "") +
        '</div>';
    });
    gridEl.innerHTML = html;
    Array.prototype.forEach.call(gridEl.querySelectorAll(".card"), function(el){
      el.addEventListener("click", function(){ openDetail(el.getAttribute("data-id")); });
    });
    Array.prototype.forEach.call(gridEl.querySelectorAll(".card-delete-btn"), function(btn){
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        handleDeleteRecipe(btn.getAttribute("data-del-id"));
      });
    });
  }

  function renderSkeletons(){
    var gridEl = $("grid");
    var html = "";
    for(var i = 0; i < 4; i++){ html += '<div class="skeleton"></div>'; }
    gridEl.innerHTML = html;
    $("emptyState").style.display = "none";
  }

  /* ===================== RENDER: DETAIL ===================== */
  function metaChipHtml(value, label){
    if(!value) return "";
    return '<div class="meta-chip"><b>' + escapeHtml(value) + '</b><span>' + escapeHtml(label) + '</span></div>';
  }

  function openDetail(id){
    var f = state.cache.files[id];
    if(!f) return;
    state.currentDetailId = id;
    var md = f.parsed.metadata;
    var title = md.TITULO || f.name.replace(/\.txt$/i, "");
    var eyebrow = [md.CATEGORIA, md.SUBCATEGORIA].filter(Boolean).join(" · ");

    var chips = "";
    chips += metaChipHtml(md.PORCOES, "porções");
    chips += metaChipHtml(md.TEMPO_PREPARO_MIN, "prep. min");
    chips += metaChipHtml(md.TEMPO_FORNO_MIN, "forno min");
    chips += metaChipHtml(md.TEMPERATURA_C, "°C");
    var knownKeys = { TITULO:1, DESCRICAO:1, CATEGORIA:1, SUBCATEGORIA:1, PORCOES:1, TEMPO_PREPARO_MIN:1, TEMPO_FORNO_MIN:1, TEMPERATURA_C:1 };
    Object.keys(md).forEach(function(k){
      if(!knownKeys[k]){ chips += metaChipHtml(md[k], humanize(k)); }
    });

    var ingredientsHtml = "";
    f.parsed.ingredientBlocks.forEach(function(block){
      ingredientsHtml += '<div class="block-title">' + escapeHtml(block.title) + '</div><ul class="ingredient-list">';
      block.items.forEach(function(item, idx){
        ingredientsHtml += '<li data-block="' + escapeHtml(block.title) + '" data-idx="' + idx + '">' +
          (item.qty ? '<span class="qty">' + escapeHtml(item.qty) + '</span>' : "") +
          (item.unit ? '<span class="unit">' + escapeHtml(item.unit) + '</span>' : "") +
          '<span class="name">' + escapeHtml(item.name) + '</span></li>';
      });
      ingredientsHtml += "</ul>";
    });

    var stepsHtml = "";
    if(f.parsed.steps.length){
      stepsHtml = '<div class="block-title">Preparação</div><ol class="steps-list">';
      f.parsed.steps.forEach(function(step, idx){
        stepsHtml += '<li data-idx="' + idx + '"><span class="num"></span><span class="txt">' + escapeHtml(step) + '</span></li>';
      });
      stepsHtml += "</ol>";
    }

    var extrasHtml = "";
    f.parsed.extras.forEach(function(ex){
      extrasHtml += '<div class="extra-block"><div class="block-title">' + escapeHtml(ex.title) + '</div>';
      ex.lines.forEach(function(l){ extrasHtml += "<p>" + escapeHtml(l) + "</p>"; });
      extrasHtml += "</div>";
    });

    var notesHtml = f.parsed.notes ? '<div class="notes-block">' + escapeHtml(f.parsed.notes) + '</div>' : "";

    var tagsHtml = "";
    if(f.parsed.tags.length){
      tagsHtml = '<div class="tags-row">' + f.parsed.tags.map(function(t){ return '<span class="tag-pill">' + escapeHtml(t) + '</span>'; }).join("") + '</div>';
    }

    var html =
      '<div class="detail-card">' +
        '<div class="detail-holes"><span></span><span></span><span></span><span></span><span></span></div>' +
        '<div class="detail-inner">' +
          (eyebrow ? '<div class="detail-eyebrow">' + escapeHtml(eyebrow) + '</div>' : "") +
          '<h2 class="detail-title">' + escapeHtml(title) + '</h2>' +
          '<div class="detail-rule"></div>' +
          (md.DESCRICAO ? '<p class="detail-desc">' + escapeHtml(md.DESCRICAO) + '</p>' : "") +
          (chips ? '<div class="meta-chips">' + chips + '</div>' : "") +
          ingredientsHtml +
          stepsHtml +
          extrasHtml +
          notesHtml +
          tagsHtml +
          '<button class="danger-btn" id="deleteRecipeBtn">Eliminar receita</button>' +
        '</div>' +
      '</div>' +
      '<footer class="appfooter"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAKAAAACgCAYAAACLz2ctAACb40lEQVR4nOy9d7xdV3Un/l1771Nuff09SU/VsiR3G8u4YIpN7yVEJgkkZAIpDGmQwGQSMpYnIcmkTSokkDCpE2LBQCCm2SBhwAZbAhe5qFn16en1d/spe+/1+2Ofc999z5IbEGDmt9/n6B6de+4pe6+96netTfh/tDEzAQARMTOLZ3odIrL59YiIV14/v8e386z/f/s+bsxMzKx6Bzw7Lp/oNz2/Ped5T+0BQLfyrdJdD7Sbdyvm3erbuub/Q+0HvqMy7qLPctwAXWLLORzt3LnTEpFdWFjoB1AnIpO0+FqviKmneWt2t6GjN+Emw8z9RLQI3Kiz+w61Z9tBaaR0ei/v9Rp7Gnzjjd3v6P/niq7Rk5/y/dnyQWRurwfUywHviwAmiajtuFr8SiD4AhHFZ/ntVgA/GsedsbZuf8Ny+mtsO1uhmJMkpjhJQcywQsAKsbyTCICxgGUQBCzZvZ4f1HwuXpykyT7yxMc9+CgVKq8OvULBl97tAD5ARCkzix6RnU8Kzq6aE7T9bvbb91v7QSZAQUSWOdlugJcx6EGFZB9QPOOOd15OVPgcM/sAntvpdEbb1H5NlNRXSxJXtpMG+gYqfYZTNOIFtNM5CCFARGBmMFtYoWCwXD1kABIEx78EgqAAKSU67QhF1YcgKMIagBlQ7CGJEqjI/5hf9D9fkZX5YrF4GwBLROk53ssnouS73X/fL+0HhgB7jYancO46Ijp54sSJS6vDwcetjLYkXAd8i0jHaHcasNBIbWRAmi1JYeE9ri+IBairIuZMCtCCYJFLdrLMAEBCgixbZhICDCJmgC2Lwf4hUqzQWmhbpOLEWN+YJPA/jBZXfQzASQCjcWOOpBeuV6F8FAhPwhHp//Vi+geGAFc2ZhZ7sEfcSF29qmRgbupEzde2dfPGxfb0vGazqlxVhUZnxrDogEkzsyJLLCxZCEFkyYJZAqb4uHsQE8gKOHaXESATtCRYEu5Yr4qZM7X8GAkwLFJoTSCSQklf+oAlVFUZXtuDT+FE2S/2VYt9v2GM9WWz/bfU379wK7PcAfC5rOz/W9r3PQEu6XoL/YBXICpP8tGjIW3aFGXfrzEwL5utn3xbqRpev5jOoJEsQIUaaRrDaGthMwphgmWASQAQYAI4IyxhOdfCshsDVgDmrD0k4YgP7tNxwow/0vKNCRAEyxYWDOTMkwSzFiKUIXEHKFOZhypD82B6x0ihbzcRzWbvF0xPT3tjY2PN70oHf4/bDwIBSgAWaL3MWnqxEMX3Ji1c7pcwbtJo7fHa0Z8dHe6/YrpzHK14zkBaWEAwEwun1BMzOaUMBAvASfOccAQACyazdCz73hKBz9JDjyM0Ft3z3QlLROlOteCcWJnA+bWZQCQsnDsIvueT6sCO+UPN/kr/7rIo/zER3RnPx5dbYZthX3gM/5dxxR8AArxV7gKwAzty6/Cipp7/e20Wt7NqoBa30UraGiIVDC2YGAwJMHV5EvPSGDnfTC+BCAC8ggBzgso55Ipn6orkp0aA3WszdYmfIZZdmy0DBPaFIqGB4eIwTMfMVwvVf6z4fXs5jveUSqVT/zcQXW/7viZAZlZEpAFAc/ymTqfx/KZZfJPxmkP1eJKtbFqCRzC+YFgw2A0sOY5HS9fpXvP7kQCXLG8GZ0yXjLChDGU1rGIoHIZN018a8aqfBHCaiAwzFxYWFryBgYH2uSzqH4T2fUWAPdEMCWcFWs36TbCdN9fSyddQEKHeqaGVNJglyBKB2EBYC0A58QpyBGLP7k77ThOgE+/ZvhD5CT1iHoCweDIO2H0+srAEEARgiImFIRANyaosU7EzFFb3lv3iB+ebzQfL8NGIGyeGhoaaP6j+w+8rAlzZOrrzU+109oMU1vz5xmlroK0lK0m   function closeDetail(){
    $("detailScreen").classList.remove("visible");
    $("gridScreen").classList.add("visible");
    $("fabWrap").style.display = "flex";
    state.currentDetailId = null;
  }

  function handleDeleteRecipe(id){
    if(!window.confirm("Eliminar esta receita? Esta ação não pode ser desfeita.")) return;
    getValidToken(true).then(function(token){
      return deleteFile(id, token);
    }).then(function(){
      delete state.cache.files[id];
      saveCache(state.cache);
      closeDetail();
      renderCategoryChips();
      renderGrid();
      toast("Receita eliminada.");
    }).catch(function(){
      toast("Não foi possível eliminar. Tenta novamente.");
    });
  }

  /* ===================== UPLOAD ===================== */
  function handleFiles(fileList){
    var files = Array.prototype.filter.call(fileList, function(f){
      return /\.txt$/i.test(f.name) || f.type === "text/plain";
    });
    if(files.length === 0){
      toast("Escolhe ficheiros .txt.");
      return;
    }
    var lastError = null;
    getValidToken(true).then(function(token){
      return ensureFolder(token).then(function(folderId){
        state.cache.folderId = folderId;
        var chain = Promise.resolve();
        var done = 0;
        files.forEach(function(file, idx){
          chain = chain.then(function(){
            toast("A carregar " + (idx + 1) + " de " + files.length + "...", 4000);
            return uploadTxtFile(folderId, file, token).then(function(){ done++; }).catch(function(err){
              lastError = (err && err.message) ? err.message : String(err);
              console.error("Falha ao carregar " + file.name + ":", err);
            });
          });
        });
        return chain.then(function(){ return done; });
      });
    }).then(function(done){
      if(done > 0){
        toast(done + " receita" + (done === 1 ? "" : "s") + " carregada" + (done === 1 ? "" : "s") + ".");
      } else {
        toast("Falha ao carregar: " + (lastError || "erro desconhecido"), 5000);
      }
      renderSkeletons();
      return syncRecipes();
    }).then(function(){
      renderCategoryChips();
      renderGrid();
    }).catch(function(err){
      var msg = (err && err.message) ? err.message : "erro de ligação";
      toast("Não foi possível carregar: " + msg, 5000);
      console.error("Erro geral no upload:", err);
    });
  }

  /* ===================== THEME ===================== */
  function applyTheme(theme){
    document.documentElement.classList.toggle("dark", theme === "dark");
    var icon = $("themeIcon");
    if(theme === "dark"){
      icon.innerHTML = '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>';
    } else {
      icon.innerHTML = '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>';
    }
  }
  function toggleTheme(){
    var current = localStorage.getItem(THEME_KEY) === "dark" ? "dark" : "light";
    var next = current === "dark" ? "light" : "dark";
    localStorage.setItem(THEME_KEY, next);
    applyTheme(next);
  }

  /* ===================== AUTH FLOW ===================== */
  function showLogin(errMsg){
    $("authLoading").style.display = "none";
    $("gridScreen").classList.remove("visible");
    $("loginScreen").style.display = "flex";
    $("fabWrap").style.display = "none";
    if(errMsg){
      $("loginError").style.display = "block";
      $("loginError").textContent = errMsg;
    } else {
      $("loginError").style.display = "none";
    }
  }

  function showApp(){
    $("loginScreen").style.display = "none";
    $("authLoading").style.display = "none";
    $("gridScreen").classList.add("visible");
    $("fabWrap").style.display = "flex";
  }

  function bootAuthenticated(){
    showApp();
    renderSkeletons();
    syncRecipes().then(function(){
      renderCategoryChips();
      renderGrid();
    }).catch(function(){
      renderCategoryChips();
      renderGrid();
      toast("Não foi possível sincronizar. A mostrar dados guardados.");
    });
  }

  function boot(){
    state.cache = loadCache();
    applyTheme(localStorage.getItem(THEME_KEY) === "dark" ? "dark" : "light");
    renderCategoryChips();
    renderGrid();

    var gisReady = function(){
      initTokenClient();
      if(loadCachedToken()){
        bootAuthenticated();
        return;
      }
      $("authLoading").style.display = "flex";
      ensureToken(false).then(function(){
        bootAuthenticated();
      }).catch(function(){
        showLogin();
      });
    };

    if(window.google && google.accounts && google.accounts.oauth2){
      gisReady();
    } else {
      var tries = 0;
      var iv = setInterval(function(){
        tries++;
        if(window.google && google.accounts && google.accounts.oauth2){
          clearInterval(iv);
          gisReady();
        } else if(tries > 100){
          clearInterval(iv);
          showLogin("Não foi possível carregar o login Google. Verifica a ligação.");
        }
      }, 100);
    }
  }

  /* ===================== EVENTS ===================== */
  document.addEventListener("DOMContentLoaded", function(){
    $("themeToggle").addEventListener("click", toggleTheme);
    $("backBtn").addEventListener("click", closeDetail);
    $("fabBtn").addEventListener("click", function(){ $("fileInput").click(); });
    $("emptyUploadBtn").addEventListener("click", function(){ $("fileInput").click(); });
    $("fileInput").addEventListener("change", function(e){
      if(e.target.files && e.target.files.length){ handleFiles(e.target.files); }
      e.target.value = "";
    });
    $("loginBtn").addEventListener("click", function(){
      $("loginError").style.display = "none";
      ensureToken(true).then(function(){
        bootAuthenticated();
      }).catch(function(){
        showLogin("Não foi possível iniciar sessão. Tenta novamente.");
      });
    });
    var searchDebounce;
    $("searchInput").addEventListener("input", function(e){
      clearTimeout(searchDebounce);
      var val = e.target.value;
      searchDebounce = setTimeout(function(){
        state.searchTerm = val;
        renderGrid();
      }, 150);
    });

    if("serviceWorker" in navigator){
      navigator.serviceWorker.register("./service-worker.js").catch(function(){});
    }

    boot();
  });
})();
</script>
</body>
</html>
