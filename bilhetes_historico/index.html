<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bilhetes CP · Histórico</title>
<meta name="theme-color" content="#008542">
<link rel="icon" type="image/png" href="icon-192.png">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data:; connect-src 'self' https://bmdpereira.duckdns.org https://accounts.google.com https://oauth2.googleapis.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--primary:#008542;--primary-dark:#006B35;--bg:#F7F8F7;--card:#fff;--line:#E1E5E3;--text:#1F2925;--text2:#66736D;
  --ok:#0b6b36;--ok-bg:#E6F4EC;--warn:#8A5A00;--warn-bg:#FFF3D6;--err:#B3261E;--err-bg:#FCE9E7;--mut-bg:#EEF1F0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
header{background:var(--primary);color:#fff;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1}
header a{color:#fff;text-decoration:none;opacity:.9}
main{max-width:1100px;margin:0 auto;padding:12px 16px 32px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
.centro{max-width:360px;margin:60px auto;text-align:center}
button{font:inherit;border:1px solid var(--primary);background:var(--primary);color:#fff;border-radius:8px;padding:8px 14px;cursor:pointer}
button.sec{background:#fff;color:var(--primary-dark)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input[type=search]{font:inherit;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;min-width:0}
input[type=search]{flex:1;min-width:140px}
.tabs{display:flex;gap:6px;margin:12px 0 0}
.tabs button{background:#fff;color:var(--text);border-color:var(--line)}
.tabs button[aria-selected=true]{background:var(--primary);color:#fff;border-color:var(--primary)}
.resumo{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.chip{border-radius:999px;padding:3px 10px;font-size:13px;background:var(--mut-bg)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.err{background:var(--err-bg);color:var(--err)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{position:sticky;top:0;background:#fff;text-align:left;font-weight:600;color:var(--text2);border-bottom:2px solid var(--line);padding:6px 8px;white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hora{white-space:nowrap;font-variant-numeric:tabular-nums}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:13px;background:var(--mut-bg)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.err{background:var(--err-bg);color:var(--err)}
.mut{color:var(--text2);font-size:13px}
.vazio{text-align:center;color:var(--text2);padding:24px}
.scroll{overflow-x:auto}
@media (max-width:640px){.esconde-m{display:none}}
</style>
</head>
<body>
<header><h1>Bilhetes CP · Histórico de pedidos</h1><a href="../">&larr; Início</a><a href="../bilhetes_cp/">Bilhetes CP</a></header>
<div id="auth" class="card centro" hidden>
  <p id="authMsg">Entra com a conta Google do administrador.</p>
  <button id="btnEntrar" type="button">Entrar com Google</button>
</div>
<main id="app" hidden>
  <div class="card">
    <div class="bar">
      <select id="fPessoa" aria-label="Pessoa"><option value="">Todas as pessoas</option></select>
      <select id="fResultado" aria-label="Resposta"><option value="">Todas as respostas</option></select>
      <select id="fFase" aria-label="Fase"><option value="">Todas as fases</option></select>
      <select id="fDias" aria-label="Período"><option value="90">90 dias</option><option value="30">30 dias</option><option value="7">7 dias</option><option value="1">Hoje</option></select>
      <input id="fTexto" type="search" placeholder="Procurar (ID, comboio, código, detalhe…)" aria-label="Procurar">
      <button id="btnAtualizar" class="sec" type="button">Atualizar</button>
    </div>
    <div id="resumo" class="resumo"></div>
    <div id="aviso" class="mut" role="status"></div>
  </div>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tabPedidos" aria-selected="true">Pedidos à CP</button>
    <button type="button" role="tab" id="tabDesfechos" aria-selected="false">Desfecho de cada compra</button>
  </div>
  <div class="card scroll" id="lista"></div>
</main>
<script>
const CLIENT_ID = '108256538530-fgunbb52s7f3s9aurfpjtaf01v8fjbph.apps.googleusercontent.com';
const API_URL = 'https://bmdpereira.duckdns.org/dados-api';
const SCOPE = 'openid email';
const TOKEN_KEY = 'bilhetes_historico.token.v1';
const TZ = 'Europe/Lisbon';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lsGet = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch { /* modo privado */ } };
const lsDel = (k) => { try { localStorage.removeItem(k); } catch { /* idem */ } };

const RESULTADO = { ok: 'Aceite', sold_out: 'Esgotado', not_open: 'Ainda não abriu', recusado: 'Recusado', transient: 'Erro temporário', erro: 'Erro', '429': 'Demasiados pedidos',
  CONFIRMED: 'Comprado', SALE_CREATED: 'Venda criada', SOLD_OUT: 'Esgotado', FAILED: 'Falhou', AMBIGUOUS: 'Estado incerto', OK: 'OK', FALHA: 'Falha' };
const FASE = { retencao: 'Reter lugar (antes de T)', venda: 'Venda (a T)', lugar: 'Mudar de lugar', desconto: 'Desconto do passe' };
const classe = (r) => /^(ok|CONFIRMED|SALE_CREATED|OK)$/.test(r) ? 'ok' : /^(sold_out|not_open|transient|SOLD_OUT|AMBIGUOUS)$/.test(r) ? 'warn' : r ? 'err' : '';
const nomeRes = (r) => RESULTADO[r] || r || '—';

function fmtHora(ts) {   // «2026-10-01T17:20:00.100+01:00» → «2026-10-01 17:20:00.100» (hora de Lisboa, data completa para debug)
  const d = new Date(ts); if (isNaN(d)) return esc(ts || '');
  const f = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' }).formatToParts(d).map(p => [p.type, p.value]));
  return `${f.year}-${f.month}-${f.day} ${f.hour}:${f.minute}:${f.second}.${String(d.getMilliseconds()).padStart(3, '0')}`;
}
function fmtRel(ms) {
  if (ms == null) return '';
  const a = Math.abs(ms), s = ms < 0 ? '−' : '+';
  return a >= 60000 ? s + (a / 60000).toFixed(1) + ' min' : a >= 1000 ? s + (a / 1000).toFixed(1) + ' s' : s + a + ' ms';
}
const fmtData = (d) => d || '';

/* ---------- autenticação Google ---------- */
let accessToken = null, tokenClient = null;
function cachedToken() {
  try { const t = JSON.parse(lsGet(TOKEN_KEY) || 'null'); if (t && t.scope === SCOPE && Date.now() < t.expires_at - 60000) return t.access_token; } catch { /* ignora */ }
  return null;
}
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
async function esperarGoogle() { for (let i = 0; i < 150 && !window.google?.accounts?.oauth2; i++) await sleep(80); return !!window.google?.accounts?.oauth2; }
function pedirToken(prompt) {
  return new Promise((res, rej) => {
    if (!tokenClient) tokenClient = google.accounts.oauth2.initTokenClient({ client_id: CLIENT_ID, scope: SCOPE, callback: () => { } });
    tokenClient.callback = (r) => {
      if (r.error) return rej(r);
      accessToken = r.access_token;
      lsSet(TOKEN_KEY, JSON.stringify({ access_token: accessToken, scope: SCOPE, expires_at: Date.now() + (r.expires_in || 3600) * 1000 }));
      res();
    };
    tokenClient.error_callback = (e) => rej(e || { error: 'popup' });
    tokenClient.requestAccessToken({ prompt });
  });
}
function mostrarEntrar(msg) { $('#authMsg').textContent = msg || 'Entra com a conta Google do administrador.'; $('#auth').hidden = false; $('#app').hidden = true; }

async function api(caminho, repetido = false) {
  let res;
  try { res = await fetch(API_URL + caminho, { headers: { Authorization: 'Bearer ' + accessToken } }); }
  catch { throw new Error('Não foi possível contactar o servidor de casa.'); }
  if (res.status === 401 && !repetido) {
    lsDel(TOKEN_KEY);
    try { await pedirToken(''); return api(caminho, true); } catch { mostrarEntrar('A sessão expirou. Entra outra vez.'); throw new Error('Sessão expirada'); }
  }
  let corpo = null; try { corpo = await res.json(); } catch { /* sem JSON */ }
  if (res.status === 403) throw new Error('Esta conta não tem acesso (só o administrador dos Bilhetes).');
  if (!res.ok) throw new Error(corpo?.erro?.mensagem || 'Erro do servidor (' + res.status + ')');
  return corpo;
}

/* ---------- dados e vista ---------- */
let dados = { pedidos: [], desfechos: [], truncado: false }, separador = 'pedidos';

function opcoes(sel, valores, rotulo) {
  const el = $(sel), atual = el.value, primeira = el.firstElementChild.outerHTML;
  el.innerHTML = primeira + [...valores].sort().map(v => `<option value="${esc(v)}">${esc(rotulo ? rotulo(v) : v)}</option>`).join('');
  el.value = [...valores].includes(atual) ? atual : '';
}
function filtrar(linhas, campoRes) {
  const p = $('#fPessoa').value, r = $('#fResultado').value, f = $('#fFase').value, t = $('#fTexto').value.trim().toLowerCase();
  return linhas.filter(l => (!p || l.pessoa === p) && (!r || l[campoRes] === r) && (!f || !l.fase || l.fase === f) &&
    (!t || [l.id, l.comboio, l.data, l.perna, l.pessoa, l.codigo, l.detalhe, l.erro, l.referencia, l.tipo, nomeRes(l[campoRes])].join(' ').toLowerCase().includes(t)));
}
function desenhar() {
  const pedidos = filtrar(dados.pedidos, 'resultado'), desfechos = filtrar(dados.desfechos, 'resultado');
  const linhas = separador === 'pedidos' ? pedidos : desfechos;
  const contagem = {}; for (const l of linhas) contagem[l.resultado] = (contagem[l.resultado] || 0) + 1;
  $('#resumo').innerHTML = `<span class="chip">${linhas.length} ${separador === 'pedidos' ? 'pedidos' : 'compras'}</span>` +
    Object.entries(contagem).sort((a, b) => b[1] - a[1]).map(([r, n]) => `<span class="chip ${classe(r)}">${esc(nomeRes(r))}: ${n}</span>`).join('');
  $('#aviso').textContent = dados.truncado ? 'Mostrados só os 5000 pedidos mais recentes; reduz o período.' : '';
  const el = $('#lista');
  if (!linhas.length) { el.innerHTML = '<div class="vazio">Sem registos para estes filtros.</div>'; return; }
  el.innerHTML = separador === 'pedidos'
    ? `<table><thead><tr><th>ID</th><th>Data e hora</th><th>Pessoa</th><th>Comboio · viagem</th><th>Perna</th><th>Fase</th><th>Resposta</th><th class="n esconde-m">vs T</th><th class="n esconde-m">Demorou</th><th class="esconde-m">Detalhe</th></tr></thead><tbody>` +
      linhas.map(l => `<tr><td class="n">${esc(l.id)}</td><td class="hora">${fmtHora(l.ts)}</td><td>${esc(l.pessoa || '—')}</td><td>${esc(l.comboio ?? '')} <span class="mut">${esc(fmtData(l.data))}</span></td><td class="mut">${esc(l.perna)}</td>` +
        `<td>${esc(FASE[l.fase] || l.fase)}</td><td><span class="tag ${classe(l.resultado)}">${esc(nomeRes(l.resultado))}</span> <span class="mut">${l.http ? 'HTTP ' + esc(l.http) : 'sem resposta'}${l.codigo ? ' · ' + esc(l.codigo) : ''}</span></td>` +
        `<td class="n esconde-m">${esc(fmtRel(l.relTms))}</td><td class="n esconde-m">${l.rttMs != null ? esc(l.rttMs) + ' ms' : ''}</td><td class="mut esconde-m">${esc(l.detalhe)}</td></tr>`).join('') + '</tbody></table>'
    : `<table><thead><tr><th>ID</th><th>Data e hora</th><th>Pessoa</th><th>Comboio · viagem</th><th>Tipo</th><th>Resultado</th><th class="esconde-m">Referência / erro</th></tr></thead><tbody>` +
      linhas.map(l => `<tr><td class="n">${esc(l.id)}</td><td class="hora">${fmtHora(l.ts)}</td><td>${esc(l.pessoa || '—')}</td><td>${esc(l.comboio ?? '')} <span class="mut">${esc(fmtData(l.data))}</span></td><td>${esc(l.tipo)}</td>` +
        `<td><span class="tag ${classe(l.resultado)}">${esc(nomeRes(l.resultado))}</span> <span class="mut">${l.status ? 'HTTP ' + esc(l.status) : ''}</span></td><td class="mut esconde-m">${esc(l.referencia || l.erro || '')}</td></tr>`).join('') + '</tbody></table>';
}
async function carregar() {
  $('#aviso').textContent = 'A carregar…';
  try {
    dados = await api('/bilhetes/historico?dias=' + encodeURIComponent($('#fDias').value));
  } catch (e) { $('#aviso').textContent = e.message; return; }
  opcoes('#fPessoa', new Set([...dados.pedidos, ...dados.desfechos].map(l => l.pessoa).filter(Boolean)));
  opcoes('#fResultado', new Set([...dados.pedidos, ...dados.desfechos].map(l => l.resultado).filter(Boolean)), nomeRes);
  opcoes('#fFase', new Set(dados.pedidos.map(l => l.fase).filter(Boolean)), (v) => FASE[v] || v);
  desenhar();
}
function mudarSeparador(s) {
  separador = s;
  $('#tabPedidos').setAttribute('aria-selected', String(s === 'pedidos')); $('#tabDesfechos').setAttribute('aria-selected', String(s === 'desfechos'));
  desenhar();
}
async function arrancar() {
  $('#btnEntrar').onclick = async () => { try { await pedirToken(''); } catch { try { await pedirToken('consent'); } catch { return mostrarEntrar('Não consegui entrar. Tenta outra vez.'); } } iniciar(); };
  accessToken = cachedToken();
  if (!accessToken) {
    if (!(await esperarGoogle())) return mostrarEntrar('Não consegui carregar o início de sessão da Google (sem ligação?).');
    try { await pedirToken(''); } catch { return mostrarEntrar(); }
  }
  iniciar();
}
function iniciar() {
  $('#auth').hidden = true; $('#app').hidden = false;
  for (const id of ['#fPessoa', '#fResultado', '#fFase']) $(id).onchange = desenhar;
  $('#fTexto').oninput = desenhar; $('#fDias').onchange = carregar; $('#btnAtualizar').onclick = carregar;
  $('#tabPedidos').onclick = () => mudarSeparador('pedidos'); $('#tabDesfechos').onclick = () => mudarSeparador('desfechos');
  carregar();
}
arrancar();
</script>
</body>
</html>
