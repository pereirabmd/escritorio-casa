# Falhas de autenticação/autorização ao ntfy (respostas 401/403 do próprio ntfy,
# visíveis no access log do nginx do vhost bmdpereira.duckdns.org).
# Nota: o fail2ban retira o timestamp antes de aplicar o regex, por isso não o referimos.
[Definition]
failregex = ^<HOST> - .*" (?:401|403) \d+
ignoreregex =
