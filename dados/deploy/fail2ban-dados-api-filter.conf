# Guardar em /etc/fail2ban/filter.d/dados-api-auth.conf
#
# Conta 401 (credencial ausente/inválida/de outra app), 403 (utilizador fora da
# lista) e 429 (abuso de ritmo). NÃO conta 503: é a Google/BD indisponível, não
# um atacante — e banir por isso deixaria utilizadores legítimos à porta.
[Definition]
failregex = ^<HOST> - .*" (401|403|429) \d+
ignoreregex =
