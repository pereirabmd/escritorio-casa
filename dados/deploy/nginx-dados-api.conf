# 1) Fora do server{}, no http{} (ex.: /etc/nginx/conf.d/dados-api.conf):
#      limit_req_zone $binary_remote_addr zone=dados_api:10m rate=5r/s;
#
# 2) Dentro do server{} de TLS (porta 443) do MESMO vhost do ntfy/tarefas-api
#    (/etc/nginx/sites-available/bmdpereira.duckdns.org), ao lado dos outros location:

location /dados-api/ {
    limit_req zone=dados_api burst=20 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8898/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;   # nunca encadear o que o cliente enviou
    proxy_set_header X-Forwarded-Proto $scheme;

    # add_header num location apaga os do server{}: repetir o HSTS aqui
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Log próprio -> jail fail2ban dedicado (ver fail2ban-dados-api-*.conf)
    access_log /var/log/nginx/dados-api.access.log;
    error_log  /var/log/nginx/dados-api.error.log;

    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
}
