<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#5B8C7A">
<title>Tarefas de Casa</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{
  --primary:#5B8C7A; --primary-dark:#376556; --primary-light:#DCEBE5;
  --bg:#F8F7F3; --surface:#FFFFFF; --text:#26332F; --text-secondary:#71807A;
  --border:#E3E8E5; --success:#68A88A; --warning:#E5A85B; --urgent:#D97868;
  --cat-limpeza:#7E9FC4; --cat-cozinha:#E29A72; --cat-roupa:#9B91C7;
  --cat-wc:#65A9A5; --cat-compras:#D2A85B; --cat-exterior:#7EA875;
  --cat-animais:#C58B72; --cat-outros:#89958F;
}
html.dark{
  --primary:#78B49D; --primary-dark:#5B927D; --primary-light:#2B3833;
  --bg:#18211E; --surface:#222D29; --text:#EDF3F0; --text-secondary:#A8B8B1;
  --border:#35443E; --success:#79B995; --warning:#E4B66D; --urgent:#DF887B;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{
  margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text); height:100vh; overflow:hidden;
  transition:background .2s,color .2s;
}
#app{display:flex; flex-direction:column; height:100vh; height:100dvh;}
header{
  flex:0 0 auto; display:flex; align-items:center; gap:10px;
  padding:14px 16px calc(10px + env(safe-area-inset-top)) 16px;
  padding-top:calc(14px + env(safe-area-inset-top));
  background:var(--primary-dark); color:#fff;
}
header h1{font-size:17px; margin:0; font-weight:600;}
header .sub{font-size:11px; opacity:.8; margin-top:1px;}
main{flex:1 1 auto; overflow:hidden; position:relative;}
.tab{
  position:absolute; inset:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:14px 14px calc(14px + env(safe-area-inset-bottom)) 14px;
  display:none;
}
.tab.active{display:block;}
nav#tabbar{
  flex:0 0 auto; display:flex; background:var(--surface); border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);
}
nav#tabbar button{
  flex:1; background:none; border:none; padding:9px 4px 8px 4px; display:flex;
  flex-direction:column; align-items:center; gap:3px; color:var(--text-secondary);
  font-size:10.5px; font-family:inherit;
}
nav#tabbar button.active{color:var(--primary);}
nav#tabbar svg{width:22px; height:22px;}

.card{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:12px 14px; margin-bottom:10px;
}
.task-row{display:flex; align-items:center; gap:10px;}
.task-check{
  width:26px; height:26px; border-radius:8px; border:2px solid var(--border);
  flex:0 0 auto; display:flex; align-items:center; justify-content:center;
  background:var(--surface);
}
.task-check.done{background:var(--success); border-color:var(--success);}
.task-check svg{width:15px; height:15px; stroke:#fff; display:none;}
.task-check.done svg{display:block;}
.task-info{flex:1; min-width:0;}
.task-nome{font-size:14.5px; font-weight:600;}
.task-nome.done{text-decoration:line-through; color:var(--text-secondary);}
.task-meta{font-size:11.5px; color:var(--text-secondary); margin-top:1px;}
.cat-dot{width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:5px;}
.badge{font-size:10.5px; padding:2px 8px; border-radius:20px; font-weight:600;}
.badge.atrasada{background:var(--urgent); color:#fff;}
.badge.hoje{background:var(--warning); color:#fff;}

.empty{text-align:center; padding:40px 16px; color:var(--text-secondary); font-size:13.5px;}

h2.section-title{font-size:13px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-secondary); margin:4px 0 8px 2px;}

.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:10px;}
.cal-dow{text-align:center; font-size:10px; color:var(--text-secondary); padding-bottom:4px;}
.cal-day{
  aspect-ratio:1; border-radius:10px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; font-size:12px; background:var(--surface);
  border:1px solid var(--border); position:relative; gap:2px;
}
.cal-day.today{border-color:var(--primary); border-width:2px;}
.cal-day.selected{background:var(--primary-light);}
.cal-day.empty-cell{background:none; border:none;}
.cal-day.weekend{background:var(--bg);}
.cal-day.feriado{background:rgba(217,120,104,.12); border-color:var(--urgent);}
.cal-day.feriado > div:first-child{color:var(--urgent); font-weight:700;}
.cal-dow.weekend{color:var(--urgent); font-weight:600;}
.feriados-nota{font-size:11.5px; color:var(--text-secondary); margin:2px 0 12px 2px; line-height:1.5;}
.feriados-nota b{color:var(--urgent); font-weight:600;}
.cal-dots{display:flex; gap:2px;}
.cal-dots span{width:5px; height:5px; border-radius:50%;}

.fab{
  position:fixed; bottom:calc(72px + env(safe-area-inset-bottom)); right:18px;
  width:52px; height:52px; border-radius:50%; background:var(--primary); color:#fff;
  border:none; display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 14px rgba(0,0,0,.2); z-index:5;
}
.fab svg{width:24px; height:24px; stroke:#fff;}

.modal-backdrop{
  position:fixed; inset:0; background:rgba(0,0,0,.4); display:none;
  align-items:flex-end; z-index:20;
}
.modal-backdrop.open{display:flex;}
.modal{
  background:var(--surface); width:100%; border-radius:20px 20px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom)) 18px; max-height:85vh; overflow-y:auto;
}
.modal h3{margin:0 0 14px 0; font-size:16px;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:12px; color:var(--text-secondary); margin-bottom:4px;}
.field input, .field select{
  width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
  background:var(--bg); color:var(--text); font-size:14px; font-family:inherit;
}
.chip-group{display:flex; flex-wrap:wrap; gap:6px;}
.chip{
  padding:6px 12px; border-radius:20px; border:1px solid var(--border); font-size:12.5px;
  background:var(--bg); color:var(--text);
}
.chip.selected{background:var(--primary); color:#fff; border-color:var(--primary);}
.btn{
  width:100%; padding:12px; border-radius:12px; border:none; background:var(--primary);
  color:#fff; font-size:14.5px; font-weight:600; font-family:inherit; margin-top:6px;
}
.btn.secondary{background:var(--bg); color:var(--text); border:1px solid var(--border);}

.person-option{
  display:flex; align-items:center; justify-content:space-between; padding:12px 14px;
  border:1px solid var(--border); border-radius:12px; margin-bottom:8px;
}
.person-option.selected{border-color:var(--primary); background:var(--primary-light);}

#toast{
  position:fixed; left:50%; bottom:90px; transform:translateX(-50%) translateY(20px);
  background:var(--primary-dark); color:#fff; padding:10px 18px; border-radius:30px;
  font-size:13px; opacity:0; transition:opacity .2s, transform .2s; z-index:30; pointer-events:none;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

#pull-indicator{
  position:absolute; top:-40px; left:0; right:0; text-align:center; font-size:11px;
  color:var(--text-secondary); transition:top .15s; z-index:15; pointer-events:none;
}

.login-screen{
  height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:16px; padding:30px;
}
.login-screen img{width:88px; height:88px;}
.login-screen p{color:var(--text-secondary); font-size:13px; text-align:center; margin:0;}
</style>
</head>

<script>
// ---------------------------------------------------------------
// CONFIG
// ---------------------------------------------------------------
const CLIENT_ID = '108256538530-fgunbb52s7f3s9aurfpjtaf01v8fjbph.apps.googleusercontent.com';
const SHEET_ID = '1ZwA9RqwCbOlfWLmYZWFsE5iq2oUqr-XZru_HDy6NjjI';
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzfbOViQ_9BI30jJWNoiL5sRptj2vUOnpA-OyYnroM4-GBQsFAjhjCHSdT4tr-kALuNqg/exec';
const VAPID_KEY = 'BJNuaIlSVerEJ6W7SuANJYDx53ynOGswUnL5zE_HG_KVBVh-1v5u9oliQ2WisT6y8_Vn3as7g8Dbla04Is3RRew';
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyDzjj6gCkFYSstqW4Y7tBUGnOKFIap9FlA',
  authDomain: 'bmdpereira-5a8f4.firebaseapp.com',
  projectId: 'bmdpereira-5a8f4',
  storageBucket: 'bmdpereira-5a8f4.firebasestorage.app',
  messagingSenderId: '951047052830',
  appId: '1:951047052830:web:921d360204b7155d80d80f'
};
const SCOPE = 'https://www.googleapis.com/auth/spreadsheets';
const CAT_CORES = {
  'Limpeza':'var(--cat-limpeza)', 'Cozinha':'var(--cat-cozinha)', 'Roupa':'var(--cat-roupa)',
  'Casa de banho':'var(--cat-wc)', 'Compras':'var(--cat-compras)', 'Exterior':'var(--cat-exterior)',
  'Animais':'var(--cat-animais)', 'Outros':'var(--cat-outros)'
};
const DIAS_SEMANA = ['Dom','Seg','Ter','Qua','Qui','Sex','Sab'];

// ---------------------------------------------------------------
// ESTADO
// ---------------------------------------------------------------
let accessToken = null;
let tokenClient = null;
let state = { tarefas: [], instancias: [], config: {}, pessoas: [], categorias: [] };
let pessoaAtual = localStorage.getItem('tarefas.pessoa') || null;
let calMes = new Date(); calMes.setDate(1);
let diaSelecionado = formatDate(new Date());

// ---------------------------------------------------------------
// AUTH (Google Identity Services)
// ---------------------------------------------------------------
function initAuth() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPE,
    callback: (resp) => {
      if (resp.error) { toast('Erro de autenticação'); return; }
      accessToken = resp.access_token;
      localStorage.setItem('tarefas.token', accessToken);
      localStorage.setItem('tarefas.tokenExpiry', String(Date.now() + (resp.expires_in - 60) * 1000));
      carregarTudo();
    }
  });

  const savedToken = localStorage.getItem('tarefas.token');
  const savedExpiry = Number(localStorage.getItem('tarefas.tokenExpiry') || 0);
  if (savedToken && Date.now() < savedExpiry) {
    accessToken = savedToken;
    carregarTudo();
  } else {
    tokenClient.requestAccessToken({ prompt: '' });
  }
}

// ---------------------------------------------------------------
// SHEETS API HELPERS
// ---------------------------------------------------------------
async function sheetsGet(range) {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(range)}`;
  const res = await fetch(url, { headers: { Authorization: 'Bearer ' + accessToken } });
  if (res.status === 401) { tokenClient.requestAccessToken({ prompt: '' }); throw new Error('token expirado'); }
  const data = await res.json();
  return data.values || [];
}

async function sheetsAppend(range, row) {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(range)}:append?valueInputOption=USER_ENTERED`;
  const res = await fetch(url, {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
    body: JSON.stringify({ values: [row] })
  });
  return res.ok;
}

async function sheetsUpdate(range, values) {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(range)}?valueInputOption=USER_ENTERED`;
  const res = await fetch(url, {
    method: 'PUT',
    headers: { Authorization: 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
    body: JSON.stringify({ values: [values] })
  });
  return res.ok;
}

function rowsToObjects(rows) {
  if (!rows.length) return [];
  const headers = rows[0];
  return rows.slice(1).map((row, i) => {
    const obj = {};
    headers.forEach((h, idx) => obj[h] = row[idx] ?? '');
    obj._rowIndex = i + 2;
    return obj;
  });
}

// ---------------------------------------------------------------
// CARREGAR DADOS
// ---------------------------------------------------------------
async function carregarTudo() {
  document.getElementById('header-sub').textContent = 'a sincronizar...';
  try {
    const [tarefasRows, instanciasRows, configRows] = await Promise.all([
      sheetsGet('Tarefas!A:J'),
      sheetsGet('Instancias!A:G'),
      sheetsGet('Config!A:C')
    ]);
    state.tarefas = rowsToObjects(tarefasRows).filter(t => String(t.Ativa).toUpperCase() === 'TRUE');
    state.instancias = rowsToObjects(instanciasRows);
    const configRaw = rowsToObjects(configRows);
    state.config = {};
    configRaw.forEach(r => state.config[String(r.Chave).trim()] = r.Valor);
    state.pessoasObjs = configRaw
      .filter(r => /^Pessoa\d+_Nome$/i.test(String(r.Chave || '').trim()) && String(r.Valor || '').trim())
      .map(r => ({ nome: String(r.Valor).trim(), chave: String(r.Chave).trim(), rowIndex: r._rowIndex }));
    state.pessoas = state.pessoasObjs.map(p => p.nome);
    state.categorias = configRaw
      .filter(r => /^Categoria\d+$/i.test(String(r.Chave || '').trim()))
      .map(r => String(r.Valor || '').trim())
      .filter(Boolean);

    if (!state.pessoas.length) {
      console.warn('Nenhuma "PessoaN_Nome" encontrada na tab Config. Linhas lidas:', configRaw);
    }

    document.getElementById('header-sub').textContent = 'atualizado agora';
    renderTudo();
  } catch (e) {
    document.getElementById('header-sub').textContent = 'falha ao sincronizar';
    console.error(e);
  }
}

// ---------------------------------------------------------------
// RENDER — HOJE
// ---------------------------------------------------------------
function renderTudo() {
  renderHoje();
  renderCalendario();
  renderTarefas();
  renderConfigPessoas();
  renderFormOpcoes();
}

function tarefaPorId(id) { return state.tarefas.find(t => t.ID === id); }

function renderHoje() {
  const hoje = formatDate(new Date());
  const doHoje = state.instancias.filter(i => i.Data === hoje && i.Estado !== 'Feita');
  const feitas = state.instancias.filter(i => i.Data === hoje && i.Estado === 'Feita');
  const atrasadas = state.instancias.filter(i => i.Estado === 'Atrasada');

  const listaHoje = document.getElementById('lista-hoje');
  listaHoje.innerHTML = '';
  if (!doHoje.length && !feitas.length) {
    listaHoje.innerHTML = '<div class="empty">Sem tarefas para hoje 🎉</div>';
  } else {
    [...doHoje, ...feitas].forEach(inst => listaHoje.appendChild(renderTaskRow(inst)));
  }

  const listaAtrasadas = document.getElementById('lista-atrasadas');
  listaAtrasadas.innerHTML = '';
  if (!atrasadas.length) {
    listaAtrasadas.innerHTML = '<div class="empty">Nenhuma tarefa atrasada</div>';
  } else {
    atrasadas.forEach(inst => listaAtrasadas.appendChild(renderTaskRow(inst)));
  }
}

function renderTaskRow(inst) {

async function marcarFeita(inst) {
  const novoEstado = inst.Estado === 'Feita' ? 'Pendente' : 'Feita';
  const agora = novoEstado === 'Feita' ? new Date().toISOString().slice(0, 16).replace('T', ' ') : '';
  inst.Estado = novoEstado;
  inst.DataConclusao = agora;
  renderHoje();
  const ok = await sheetsUpdate(`Instancias!E${inst._rowIndex}:F${inst._rowIndex}`, [novoEstado, agora]);

}

// ---------------------------------------------------------------
// FERIADOS NACIONAIS (PT) — cálculo dinâmico via data da Páscoa
// ---------------------------------------------------------------
function calcularPascoa(ano) {
  // Algoritmo de Meeus/Jones/Butcher
  const a = ano % 19, b = Math.floor(ano / 100), c = ano % 100;
  const d = Math.floor(b / 4), e = b % 4;
  const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const mes = Math.floor((h + l - 7 * m + 114) / 31);
  const dia = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(ano, mes - 1, dia);
}

function feriadosDoAno(ano) {
  const pascoa = calcularPascoa(ano);
  const addDias = (data, n) => { const d = new Date(data); d.setDate(d.getDate() + n); return d; };
  const lista = [
    { data: new Date(ano, 0, 1), nome: 'Ano Novo' },
    { data: addDias(pascoa, -2), nome: 'Sexta-feira Santa' },
    { data: pascoa, nome: 'Páscoa' },
    { data: new Date(ano, 3, 25), nome: 'Dia da Liberdade' },
    { data: new Date(ano, 4, 1), nome: 'Dia do Trabalhador' },
    { data: addDias(pascoa, 60), nome: 'Corpo de Deus' },
    { data: new Date(ano, 5, 10), nome: 'Dia de Portugal' },
    { data: new Date(ano, 7, 15), nome: 'Assunção de Nossa Senhora' },
    { data: new Date(ano, 9, 5), nome: 'Implantação da República' },
    { data: new Date(ano, 10, 1), nome: 'Todos os Santos' },
    { data: new Date(ano, 11, 1), nome: 'Restauração da Independência' },
    { data: new Date(ano, 11, 8), nome: 'Imaculada Conceição' },
    { data: new Date(ano, 11, 25), nome: 'Natal' }
  ];
  const map = {};
  lista.forEach(f => map[formatDate(f.data)] = f.nome);
  return map;
}

let feriadosCache = {};
function getFeriados(ano) {
  if (!feriadosCache[ano]) feriadosCache[ano] = feriadosDoAno(ano);
  return feriadosCache[ano];
}

function renderCalendario() {
  const dowRow = document.getElementById('cal-dow-row');
  dowRow.innerHTML = DIAS_SEMANA.map((d, i) => `<div class="cal-dow${(i === 0 || i === 6) ? ' weekend' : ''}">${d}</div>`).join('');

  const label = calMes.toLocaleDateString('pt-PT', { month: 'long', year: 'numeric' });
  document.getElementById('cal-mes-label').textContent = label.charAt(0).toUpperCase() + label.slice(1);

  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';
  const primeiroDia = new Date(calMes.getFullYear(), calMes.getMonth(), 1);
  const offset = primeiroDia.getDay();
  const diasNoMes = new Date(calMes.getFullYear(), calMes.getMonth() + 1, 0).getDate();
  const hojeStr = formatDate(new Date());
  const feriados = getFeriados(calMes.getFullYear());

  for (let i = 0; i < offset; i++) {
    const cell = document.createElement('div');
    cell.className = 'cal-day empty-cell';
    grid.appendChild(cell);
  }

  const feriadosDoMes = [];

  for (let d = 1; d <= diasNoMes; d++) {
    const dataObj = new Date(calMes.getFullYear(), calMes.getMonth(), d);
    const dataStr = formatDate(dataObj);
    const doDia = state.instancias.filter(i => i.Data === dataStr);
    const diaSemanaNum = dataObj.getDay();
    const isWeekend = diaSemanaNum === 0 || diaSemanaNum === 6;
    const nomeFeriado = feriados[dataStr];

    if (nomeFeriado) feriadosDoMes.push({ dia: d, nome: nomeFeriado });

    const cell = document.createElement('div');
    cell.className = 'cal-day'
      + (dataStr === hojeStr ? ' today' : '')
      + (dataStr === diaSelecionado ? ' selected' : '')
      + (isWeekend ? ' weekend' : '')
      + (nomeFeriado ? ' feriado' : '');
    cell.title = nomeFeriado || '';
    const cores = [...new Set(doDia.map(i => {
      const t = tarefaPorId(i.TarefaID);
      return t ? (CAT_CORES[t.Categoria] || 'var(--cat-outros)') : 'var(--cat-outros)';
    }))].slice(0, 3);
    cell.innerHTML = `<div>${d}</div><div class="cal-dots">${cores.map(c => `<span style="background:${c}"></span>`).join('')}</div>`;
    cell.addEventListener('click', () => { diaSelecionado = dataStr; renderCalendario(); renderListaDia(); });
    grid.appendChild(cell);
  }

  const notaEl = document.getElementById('feriados-nota');
  notaEl.innerHTML = feriadosDoMes.length
    ? feriadosDoMes.map(f => `<b>${f.dia}</b> — ${f.nome}`).join(' · ')
    : '';

  renderListaDia();
}

function renderListaDia() {
  const label = new Date(diaSelecionado + 'T00:00:00').toLocaleDateString('pt-PT', { weekday: 'long', day: 'numeric', month: 'long' });
  const ano = Number(diaSelecionado.slice(0, 4));
  const nomeFeriado = getFeriados(ano)[diaSelecionado];
  document.getElementById('cal-dia-label').innerHTML =
    (label.charAt(0).toUpperCase() + label.slice(1)) + (nomeFeriado ? ` <span style="color:var(--urgent); text-transform:none; font-weight:600;">· ${nomeFeriado}</span>` : '');
  const lista = document.getElementById('lista-dia');
  lista.innerHTML = '';
  const doDia = state.instancias.filter(i => i.Data === diaSelecionado);
  if (!doDia.length) {
    lista.innerHTML = '<div class="empty">Sem tarefas neste dia</div>';
  } else {
    doDia.forEach(inst => lista.appendChild(renderTaskRow(inst)));
  }
}

}

function iniciarEdicaoPessoa(nomeAtual) {
  const modal = document.querySelector('#modal-pessoas-backdrop .modal');
  const rows = modal.querySelectorAll('.person-option');
  rows.forEach(row => {
    if (row.querySelector('.nome-pessoa')?.textContent === nomeAtual) {

        <button type="button" class="btn-confirmar-edicao" style="background:none; border:none; color:var(--primary); margin-left:8px;">✓</button>
      `;
      row.querySelector('.btn-confirmar-edicao').addEventListener('click', () => {
        const novoNome = row.querySelector('input').value;
        renomearPessoa(nomeAtual, novoNome);
      });
    }
  });
}

async function adicionarPessoa(nome) {
  nome = nome.trim();
  if (!nome) { toast('Escreve um nome'); return; }
  if (state.pessoas.includes(nome)) { toast('Já existe uma pessoa com esse nome'); return; }

  const nums = state.pessoasObjs.map(p => Number((p.chave.match(/\d+/) || [0])[0]));
  const proximoNum = nums.length ? Math.max(...nums) + 1 : 1;
  const ok = await sheetsAppend('Config!A:C', [`Pessoa${proximoNum}_Nome`, nome, '']);
  if (ok) {
    toast('Pessoa adicionada');
    await carregarTudo();
    renderGerirPessoasModal();
  } else {
    toast('Falha ao adicionar pessoa');
  }
}

async function renomearPessoa(nomeAntigo, novoNome) {
  novoNome = novoNome.trim();
  if (!novoNome || novoNome === nomeAntigo) { renderGerirPessoasModal(); return; }

  const pessoaObj = state.pessoasObjs.find(p => p.nome === nomeAntigo);
  if (!pessoaObj) return;

  const ok = await sheetsUpdate(`Config!B${pessoaObj.rowIndex}`, [novoNome]);
  if (!ok) { toast('Falha ao renomear'); return; }

  await atualizarReferenciasPessoa(nomeAntigo, novoNome, { apenasPendentes: false });

  if (pessoaAtual === nomeAntigo) {
    pessoaAtual = novoNome;
    localStorage.setItem('tarefas.pessoa', novoNome);
  }
  toast('Nome atualizado — tarefas associadas também foram atualizadas');
  await carregarTudo();
  renderGerirPessoasModal();
}

async function removerPessoa(nome) {
  if (state.pessoas.length <= 1) {
    toast('Tem de existir pelo menos uma pessoa');
    return;
  }

  const tarefasAfetadas = state.tarefas.filter(t => t.PessoaPadrao === nome).length;
  const instanciasAfetadas = state.instancias.filter(i => i.Pessoa === nome && i.Estado !== 'Feita').length;
  const totalAfetado = tarefasAfetadas + instanciasAfetadas;

  let substituto = null;
  if (totalAfetado > 0) {
    substituto = await escolherSubstituto(nome, totalAfetado);
    if (substituto === null) { renderGerirPessoasModal(); return; }
  } else if (!confirm(`Remover ${nome}?`)) {
    return;
  }

  if (substituto) {
    await atualizarReferenciasPessoa(nome, substituto, { apenasPendentes: true });
  }

  const pessoaObj = state.pessoasObjs.find(p => p.nome === nome);
  if (pessoaObj) {
    await sheetsUpdate(`Config!A${pessoaObj.rowIndex}:B${pessoaObj.rowIndex}`, ['', '']);
  }

  if (pessoaAtual === nome) {
    pessoaAtual = null;
    localStorage.removeItem('tarefas.pessoa');
  }

  toast('Pessoa removida' + (substituto ? ` · tarefas passadas para ${substituto}` : ''));
  await carregarTudo();
  renderGerirPessoasModal();
}

function escolherSubstituto(nomeAntigo, total) {
  return new Promise((resolve) => {
    const modal = document.querySelector('#modal-pessoas-backdrop .modal');
    const outras = state.pessoas.filter(p => p !== nomeAntigo);
    modal.innerHTML = `
      <h3>Reatribuir tarefas</h3>
      <p style="font-size:13px; color:var(--text-secondary); margin-top:0;">${nomeAntigo} tem ${total} tarefa(s) pendente(s). Escolhe quem fica responsável antes de remover:</p>
      <div class="chip-group" id="substituto-chips">${outras.map(p => `<button type="button" class="chip" data-p="${p}">${p}</button>`).join('')}</div>
      <button class="btn" id="btn-confirmar-substituto" disabled>Confirmar e remover</button>
      <button class="btn secondary" id="btn-cancelar-substituto">Cancelar</button>
    `;
    let escolhido = null;
    modal.querySelectorAll('#substituto-chips .chip').forEach(chip => {
      chip.addEventListener('click', () => {
        modal.querySelectorAll('#substituto-chips .chip').forEach(c => c.classList.remove('selected'));
        chip.classList.add('selected');
        escolhido = chip.dataset.p;
        document.getElementById('btn-confirmar-substituto').disabled = false;
      });
    });
    document.getElementById('btn-confirmar-substituto').addEventListener('click', () => resolve(escolhido));
    document.getElementById('btn-cancelar-substituto').addEventListener('click', () => resolve(null));
  });
}

async function atualizarReferenciasPessoa(nomeAntigo, novoNome, opts) {
  const updates = [];
  state.tarefas.forEach(t => {
    if (t.PessoaPadrao === nomeAntigo) {
      updates.push(sheetsUpdate(`Tarefas!I${t._rowIndex}`, [novoNome]));
    }
  });
  state.instancias.forEach(i => {
    if (i.Pessoa === nomeAntigo && (!opts.apenasPendentes || i.Estado !== 'Feita')) {
      updates.push(sheetsUpdate(`Instancias!D${i._rowIndex}`, [novoNome]));
    }
  });
  await Promise.all(updates);
}

document.getElementById('btn-gerir-pessoas').addEventListener('click', abrirModalPessoas);

function renderConfigPessoas() {
  const lista = document.getElementById('lista-pessoas');
  lista.innerHTML = '';
  if (!state.pessoas.length) {
    lista.innerHTML = '<div class="empty">Nenhuma pessoa encontrada na tab Config do Sheet.<br>Toca em "Gerir" para adicionar a primeira.</div>';

}

// NOTIFICAÇÕES (Firebase Messaging)
// ---------------------------------------------------------------
firebase.initializeApp(FIREBASE_CONFIG);
const messaging = firebase.messaging();

function atualizarEstadoNotif() {
  const el = document.getElementById('notif-status');
  const btn = document.getElementById('btn-notif');
  if (!('Notification' in window)) { el.textContent = 'Não suportado neste browser'; btn.disabled = true; return; }
  if (Notification.permission === 'granted') {
    el.textContent = 'Notificações ativas';
    btn.textContent = 'Notificações já ativas';
  } else if (Notification.permission === 'denied') {
    el.textContent = 'Bloqueadas nas definições do browser (estado: denied)';
  } else {
    el.textContent = 'Ainda não ativadas (estado: ' + Notification.permission + ')';
    btn.textContent = 'Ativar notificações';
  }
}

document.getElementById('btn-notif').addEventListener('click', async () => {
  if (!pessoaAtual) { toast('Escolhe primeiro quem és, em cima'); return; }
  try {
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') {
      toast('Estado devolvido: "' + permission + '" (não é bloqueio definitivo se não for "denied")');
      atualizarEstadoNotif();
      return;
    }

    const swReg = await navigator.serviceWorker.register('./firebase-messaging-sw.js');
    const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: swReg });

    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ pessoa: pessoaAtual, fcmToken: token })
    });
    const data = await res.json();
    toast(data.ok ? 'Notificações ativadas' : 'Falha ao registar: ' + data.erro);
    atualizarEstadoNotif();
  } catch (e) {
    console.error(e);
    toast('Erro: ' + (e && e.message ? e.message : String(e)));
  }
});

document.getElementById('btn-testar-notif').addEventListener('click', async () => {
  if (!pessoaAtual) { toast('Escolhe primeiro quem és, em cima'); return; }
  toast('A enviar notificação de teste...');
  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ tipo: 'teste', pessoa: pessoaAtual })
    });
    const data = await res.json();
    if (data.ok) {
      toast(`Teste enviado (${data.enviados}/${data.total})`);
    } else {
      toast('Falha: ' + (data.erro || 'sem detalhe'));
    }
  } catch (e) {
    console.error(e);
    toast('Erro de rede ao testar');
  }
});

// ---------------------------------------------------------------
// TEMA
// ---------------------------------------------------------------
function aplicarTema(tema) {
  localStorage.setItem('tarefas.tema', tema);
  const escuro = tema === 'dark' || (tema === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.classList.toggle('dark', escuro);
  document.querySelectorAll('[data-tema]').forEach(c => c.classList.toggle('selected', c.dataset.tema === tema));
}
document.querySelectorAll('[data-tema]').forEach(chip => {
  chip.addEventListener('click', () => aplicarTema(chip.dataset.tema));
});

// ---------------------------------------------------------------
// NAVEGAÇÃO POR TABS
// ---------------------------------------------------------------
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

// ---------------------------------------------------------------
// PULL TO REFRESH (custom — necessário em PWA standalone no Android)
// ---------------------------------------------------------------
function ativarPullToRefreshGlobal() {
  const indicator = document.getElementById('pull-indicator');
  let startY = null;
  let ativo = false;

  document.addEventListener('touchstart', (e) => {
    const tabAtiva = document.querySelector('.tab.active');
    if (tabAtiva && tabAtiva.scrollTop === 0 && !document.getElementById('modal-backdrop').classList.contains('open') && !document.getElementById('modal-pessoas-backdrop').classList.contains('open')) {
      startY = e.touches[0].clientY;
      ativo = true;
    } else {
      ativo = false;
      startY = null;
    }
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    if (!ativo || startY === null) return;
    const dy = e.touches[0].clientY - startY;
    if (dy > 0) {
      indicator.style.top = Math.min(dy / 2, 40) - 40 + 'px';
    }
  }, { passive: true });

  document.addEventListener('touchend', (e) => {
    if (!ativo || startY === null) return;
    const dy = e.changedTouches[0].clientY - startY;
    indicator.style.top = '-40px';
    if (dy > 70) carregarTudo();
    startY = null;
    ativo = false;
  });
}
ativarPullToRefreshGlobal();

// ---------------------------------------------------------------
// HELPERS
// ---------------------------------------------------------------
function formatDate(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

// ---------------------------------------------------------------
// ARRANQUE
// ---------------------------------------------------------------
window.addEventListener('load', () => {
  const temaGuardado = localStorage.getItem('tarefas.tema') || 'auto';
  aplicarTema(temaGuardado);
  atualizarEstadoNotif();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./service-worker.js');
  }

  const esperarGoogle = setInterval(() => {
    if (window.google && google.accounts) {
      clearInterval(esperarGoogle);
      initAuth();
    }
  }, 100);
});
</script>
