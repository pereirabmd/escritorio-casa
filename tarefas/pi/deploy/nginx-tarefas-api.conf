# Adicionar este "location" dentro do server{} de TLS (porta 443) já
# existente em /etc/nginx/sites-available/bmdpereira.duckdns.org (o mesmo
# vhost do ntfy) — não é um vhost novo, só mais uma location.
#
# Log próprio (em vez de herdar o access_log/error_log do server{}): é o que
# permite ter um jail fail2ban dedicado, sem misturar com o do ntfy — ver
# fail2ban-tarefas-api.conf e o filtro tarefas-api-auth.conf ao lado.

location /tarefas-api/ {
    proxy_pass http://127.0.0.1:8899/;
    proxy_http_version 1.1;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    access_log /var/log/nginx/tarefas-api.access.log;
    error_log  /var/log/nginx/tarefas-api.error.log;

    client_max_body_size 64k;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
}
