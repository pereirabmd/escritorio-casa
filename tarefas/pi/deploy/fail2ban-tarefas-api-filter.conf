# Guardar em /etc/fail2ban/filter.d/tarefas-api-auth.conf
#
# Assinatura inválida na ação "Marcar feita"/"Daqui a 1h" da notificação
# (servidor.py devolve 401 nesse caso — ver _tratar() em servidor.py),
# visível no access log próprio deste location. Mesmo padrão do
# filter.d/ntfy-auth.conf já existente.
[Definition]
failregex = ^<HOST> - .*" 401 \d+
ignoreregex =
