# Guardar em /etc/fail2ban/jail.d/tarefas-api.conf — mesmo molde do
# jail.d/ntfy.conf já existente.
[tarefas-api-auth]
enabled  = true
filter   = tarefas-api-auth
port     = http,https
logpath  = /var/log/nginx/tarefas-api.access.log
maxretry = 5
findtime = 10m
bantime  = 1h
ignoreip = 127.0.0.1/8 ::1 192.168.68.0/24
